# Git 훅 설정. 전체 규칙 문서: CONTRIBUTING.md
# 최초 1회 활성화: npm install  (prepare 스크립트가 lefthook install 을 실행)
#
# 검사 로직은 scripts/git-rules.cjs 한 파일에 모여 있다.

# 브랜치 이름 검사를 prepare-commit-msg에 둔 이유:
#  - pre-commit 은 스테이징된 파일이 없으면 lefthook 이 건너뛰는데, 브랜치 이름은 항상 검사해야 한다.
#  - commit-msg 보다 앞서 에디터가 열리기 전에 실행되므로, 메시지를 다 쓰고 나서 막히는 일이 없다.
prepare-commit-msg:
  commands:
    branch-name:
      run: node scripts/git-rules.cjs branch

# 자동 완성(이모지 + Jira 키)을 prepare-commit-msg 가 아닌 여기서 하는 이유:
# prepare-commit-msg 는 에디터가 열리기 전에 실행되어, `-m` 없이 에디터로 쓴 메시지는 아직 비어 있다.
commit-msg:
  piped: true # 앞 커맨드가 실패하면 뒤는 실행하지 않는다
  commands:
    complete:
      priority: 1
      run: node scripts/git-rules.cjs complete {1}
    verify:
      priority: 2
      run: node scripts/git-rules.cjs verify {1}

# 포맷터/린터는 각 파트 기술 스택이 정해지면 추가한다. 예시:
