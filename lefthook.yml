# Git 훅 설정. 전체 규칙 문서: CONTRIBUTING.md
# 최초 1회 활성화: npm install  (prepare 스크립트가 lefthook install 을 실행)
#
# 검사 로직은 scripts/git-rules.cjs 한 파일에 모여 있다.

# 병합 커밋(3-way merge)을 만들지 못하게 막는다(설계 10.8절). fast-forward로 끝나는 `git merge --ff-only`는 병합 커밋이 없어 통과한다.
# CI의 lint:history가 MR 안의 병합 커밋을 다시 막는다.
pre-merge-commit:
  commands:
    no-merge-commit:
      run: sh infra/ci/no-merge-commit.sh

# 스테이징한 변경에서 시크릿을 찾는다(설계 13.2절). gitleaks 실행 파일이나 docker가 없으면 경고만 하고 통과하며 CI의 lint:secrets가 다시 본다.
# 직접 돌리려면 `sh infra/ci/pre-commit-secrets.sh`다.
pre-commit:
  commands:
    secrets:
      run: sh infra/ci/pre-commit-secrets.sh
    # fe 의존성이 설치돼 있어야 한다(`cd fe && pnpm install`). --no-install은 npx가 패키지를 내려받지 않게 한다.
    lint-fe:
      priority: 1
      root: "fe/"
      glob: "*.{js,jsx,mjs,ts,tsx}"
      run: npx --no-install eslint --fix {staged_files}
      stage_fixed: true
    # eslint --fix가 고친 코드까지 포맷하도록 lint-fe 다음에 돈다
    format-fe:
      priority: 2
      root: "fe/"
      run: npx --no-install prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # ai 의존성이 설치돼 있어야 한다(`cd ai && uv sync`). --no-sync는 uv가 커밋 중에 의존성을 설치하지 않게 한다.
    lint-ai:
      priority: 1
      root: "ai/"
      glob: "*.py"
      run: uv run --no-sync ruff check --fix {staged_files}
      stage_fixed: true
    # ruff check --fix가 고친 코드까지 포맷하도록 lint-ai 다음에 돈다
    format-ai:
      priority: 2
      root: "ai/"
      glob: "*.py"
      run: uv run --no-sync ruff format {staged_files}
      stage_fixed: true

# 포맷터/린터는 각 파트 기술 스택이 정해지면 위 pre-commit의 commands에 추가한다. 예시:
#  - {staged_files} 는 저장소 루트 기준 경로(fe/src/...)다. root 를 쓰면 해당 폴더 기준으로 바뀐다.
#  - stage_fixed: true 는 포맷터가 고친 파일을 다시 스테이징한다.
#  - 여러 커맨드를 동시에 돌리려면 pre-commit 아래에 parallel: true 를 둔다.
#
#     format-be:
#       root: "be/"
#       glob: "*.java"
#       run: ./gradlew spotlessApply
#       stage_fixed: true
