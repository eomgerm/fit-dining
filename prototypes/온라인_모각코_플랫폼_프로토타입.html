<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>온라인 모각코 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 홈(그룹 카드 격자) → 그룹(탭: 세션 방 · 일정·출석 · 알림). 세션 방은 왼쪽 방 장면 + 내 패널, 오른쪽 뽀모도로 + 채팅·활동. 900px 아래 1열 */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --line:#DCE1E9; --fg:#1B2230; --muted:#5D6779;
  --accent:#2C59CF; --accent-weak:#E5EBFA; --accent-fg:#FFFFFF;
  --ok:#1D8657; --ok-weak:#E2F2EA; --warn:#A86E12; --warn-weak:#FAEFD9; --bad:#BF433B; --bad-weak:#F9E5E3; --info:#2C6FB5;
  --dot:#D3D9E3; --shadow:0 8px 30px rgba(20,30,60,.12);
  /* 방 장면은 두 테마에서 같은 저녁 방으로 고정 */
  --wall-top:#2E3760; --wall-bot:#46457A; --floor:#5B4A6E; --floor-line:#6C5A80; --win:#1B2244; --win-frame:#E9D9B8; --star:#FFF4CF; --bulb:#FFD98A; --plate:#FFFDF7; --plate-fg:#2A2433;
  /* 공유 화면 속 편집기도 두 테마에서 같은 어두운 화면으로 고정 */
  --ed-bg:#1C2030; --ed-bar:#151827; --ed-cur:#262C42; --ed-fg:#D6DBEA; --ed-mut:#5F6884; --ed-kw:#C792EA; --ed-st:#C3E88D; --ed-nu:#F78C6C; --ed-cm:#737D99; --ed-ty:#FFCB6B; --ed-an:#89DDFF; --live:#E5484D;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#191E27; --line:#2A313D; --fg:#E5E8EE; --muted:#98A1B1;
  --accent:#7D9DF2; --accent-weak:#1E2944; --accent-fg:#0E1424;
  --ok:#4DBE89; --ok-weak:#152D24; --warn:#E2AA4B; --warn-weak:#32281A; --bad:#EE7C73; --bad-weak:#3A1F1E; --info:#78AEE8;
  --dot:#1E242E; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#191E27; --line:#2A313D; --fg:#E5E8EE; --muted:#98A1B1;
  --accent:#7D9DF2; --accent-weak:#1E2944; --accent-fg:#0E1424;
  --ok:#4DBE89; --ok-weak:#152D24; --warn:#E2AA4B; --warn-weak:#32281A; --bad:#EE7C73; --bad-weak:#3A1F1E; --info:#78AEE8;
  --dot:#1E242E; --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.app{min-height:100%;display:flex;flex-direction:column}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-size:17px;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.05em;line-height:1.2}
.top-in .now{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.ghead{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}
.ghead .gt{padding:10px 0 0;min-width:0}
.ghead .gt .back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12.5px}
.ghead .gt h1{margin:0;font-size:18px;letter-spacing:-.01em;text-wrap:balance}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
@media (max-width:640px){nav.tabs{margin-left:0;width:100%}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}

main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:20px 16px 28px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.panel h2 .sp{margin-left:auto;font-weight:400}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],select.in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-acc{color:var(--accent)} .st-mut{color:var(--muted)} .st-info{color:var(--info)}
.state{font-weight:600}

/* 홈 */
.home-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.home-head h1{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.home-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gcard:hover{border-color:var(--muted)}
.gcard .strip{height:68px;background:linear-gradient(180deg,var(--wall-top),var(--wall-bot));position:relative;display:flex;align-items:flex-end;padding:0 14px;gap:2px}
.gcard .strip .win{position:absolute;right:14px;top:12px;width:44px;height:30px;border:3px solid var(--win-frame);border-radius:4px;background:var(--win);background-image:radial-gradient(var(--star) 1px,transparent 1.5px);background-size:11px 9px}
.gcard .strip svg{width:40px;height:34px;display:block}
.gcard .strip .empty{color:#C9C6E4;font-size:12px;padding-bottom:10px}
.gcard .bd{padding:14px;display:flex;flex-direction:column;gap:4px}
.gcard .gn{font-weight:700;font-size:16px}
.gcard .gs{display:flex;align-items:center;gap:7px;font-weight:600;margin-top:6px}
.gcard .gm{font-size:12.5px;color:var(--muted)}

/* 방 장면 */
.rhead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.rhead .clock{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.rhead .cell .v{font-family:var(--f-mono);font-size:16px;font-weight:600}
.rhead .cell .l{font-size:12px;color:var(--muted)}
.rhead .push{margin-left:auto}
.scene{position:relative;border-radius:14px;overflow:hidden;min-height:330px;
  background:linear-gradient(180deg,var(--wall-top) 0%,var(--wall-bot) 72%,var(--floor) 72%,var(--floor) 100%);border:1px solid var(--line)}
.scene::after{content:"";position:absolute;left:0;right:0;top:72%;height:2px;background:var(--floor-line)}
.scene .window{position:absolute;left:22px;top:22px;width:118px;height:74px;border:5px solid var(--win-frame);border-radius:6px;background:var(--win);
  background-image:radial-gradient(var(--star) 1px,transparent 1.6px),radial-gradient(var(--star) .8px,transparent 1.2px);background-size:29px 23px,17px 13px;background-position:0 0,8px 6px}
.scene .window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--win-frame)}
.scene .window::after{content:"";position:absolute;right:12px;top:10px;width:16px;height:16px;border-radius:50%;box-shadow:-5px 3px 0 0 var(--star)}
.scene .lights{position:absolute;left:0;right:0;top:0;height:30px;display:flex;justify-content:space-around;padding:0 160px 0 170px}
.scene .lights i{width:7px;height:9px;border-radius:50% 50% 45% 45%;background:var(--bulb);margin-top:12px;box-shadow:0 0 10px 2px rgba(255,217,138,.45)}
.scene .lights i:nth-child(even){margin-top:16px}
.scene .sign{position:absolute;right:20px;top:24px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#D9D4F2;border:1px solid rgba(217,212,242,.4);border-radius:6px;padding:4px 8px}
.seats{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px 4px;padding:120px 12px 18px}
.seat{position:relative;width:150px;display:flex;flex-direction:column;align-items:center}
@media (max-width:520px){.seat{width:46%}.scene .lights{padding:0 40px 0 150px}.scene .sign{display:none}}
.chbtn{background:none;border:0;padding:0;border-radius:12px;display:block}
.chbtn svg{width:128px;height:107px;display:block;overflow:visible}
.plate{margin-top:6px;background:var(--plate);color:var(--plate-fg);border-radius:8px;padding:3px 9px;font-size:12.5px;display:flex;gap:6px;align-items:center;max-width:100%;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.plate b{white-space:nowrap}
.plate .ps{font-weight:600;white-space:nowrap}
.ps.focus{color:#1E7A50}.ps.ask{color:#2563A8}.ps.rest{color:#7A6E86}.ps.stuck{color:#B5650E}.ps.away{color:#8E8899}
.ptodo{margin-top:4px;font-size:11.5px;color:#E6E2F7;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.empty-room{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:130px 16px 40px;color:#E6E2F7;text-align:center}
.empty-room .big{font-family:var(--f-mono);font-size:36px;font-weight:600;color:#fff;line-height:1}
.fxl{position:absolute;left:0;right:0;top:0;height:0;z-index:3;pointer-events:none}
.fx{position:absolute;left:50%;top:-4px;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:12.5px;color:#FFF3C4;animation:floatUp 1.6s ease-out forwards;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.fx svg{display:block}
.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:-10px;background:#fff;color:#2A2433;border-radius:10px;padding:5px 9px;font-size:12px;max-width:150px;width:max-content;box-shadow:0 2px 0 rgba(0,0,0,.2);z-index:4;animation:pop .2s ease-out;overflow-wrap:anywhere}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px)}}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
/* 캐릭터 움직임 */
.ch .bob{animation:bob 3.2s ease-in-out infinite}
.ch.s-focus .hand{animation:type .32s ease-in-out infinite}
.ch.s-focus .hand.hr{animation-delay:.16s}
.ch.s-ask .wave{animation:wave 1.1s ease-in-out infinite;transform-origin:100px 44px}
.ch.s-ask .qb{animation:qb 1.8s ease-in-out infinite}
.ch .steam{animation:steam 2s ease-in-out infinite}
.ch .steam.s2{animation-delay:.7s}
.ch.s-stuck .spin{animation:spin 2.4s linear infinite;transform-origin:60px 10px}
.ch .zz{animation:zz 2.6s ease-in-out infinite}
.ch .zz.z2{animation-delay:1.1s}
.ch.s-away{opacity:.62}
.ch.jump .bob{animation:jump .7s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes qb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(5px,-8px)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-16px)}70%{transform:translateY(0)}85%{transform:translateY(-3px)}100%{transform:translateY(0)}}

/* 화면 공유 */
.stage .sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stage .sh .who{font-weight:700}
.stage .sh .acts{margin-left:auto;display:flex;gap:6px}
.livetag{display:inline-flex;align-items:center;gap:5px;background:var(--live);color:#fff;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;border-radius:4px;padding:1px 6px}
.sharelist{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sharelist .who{display:flex;align-items:center;gap:6px;font-weight:600}
.sharelist .who i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.screen{background:var(--ed-bg);color:var(--ed-fg);border-radius:10px;overflow:hidden;border:1px solid var(--ed-bar);max-width:100%}
.screen .ebar{background:var(--ed-bar);display:flex;align-items:center;gap:10px;padding:6px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--ed-mut)}
.screen .etab{color:var(--ed-fg);background:var(--ed-bg);border-radius:5px 5px 0 0;padding:3px 10px;margin-bottom:-6px}
.screen .ebar .sp{margin-left:auto}
.screen .ebody{padding:8px 0;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;overflow-x:auto}
.screen.big .ebody{font-size:14px}
.screen .ln{display:flex;white-space:pre;padding-right:12px}
.screen .ln.cur{background:var(--ed-cur)}
.screen .no{width:38px;flex:none;text-align:right;padding-right:14px;color:var(--ed-mut);user-select:none}
.screen code{font-family:inherit}
.screen .kw{color:var(--ed-kw)} .screen .st{color:var(--ed-st)} .screen .nu{color:var(--ed-nu)} .screen .cm{color:var(--ed-cm);font-style:italic} .screen .ty{color:var(--ed-ty)} .screen .an{color:var(--ed-an)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ed-fg);vertical-align:text-bottom;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.modal.wide{width:min(960px,100%)}
.shareopts{display:flex;flex-direction:column;gap:6px}
.shareopts label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600}
.shareopts label:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.shareopts small{display:block;font-weight:400;color:var(--muted)}

/* 내 패널 */
.stsel{display:flex;flex-wrap:wrap;gap:6px}
.stsel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted)}
.stsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todos li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.todos li:first-child{border-top:0}
.todos input{width:17px;height:17px;accent-color:var(--accent);flex:none;margin:0}
.todos label{flex:1;min-width:0;overflow-wrap:anywhere}
.todos li.done label{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:6px;margin-top:8px}
.mesub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.mesub{grid-template-columns:minmax(0,1fr)}}
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line) inset}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.entry .pv{width:120px;height:100px;border-radius:12px;background:linear-gradient(180deg,var(--wall-top),var(--wall-bot));display:grid;place-items:end center;padding-bottom:4px}
.entry .pv svg{width:110px;height:92px}
@media (max-width:520px){.entry{grid-template-columns:minmax(0,1fr)}}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.summary div{background:var(--bg);border-radius:8px;padding:10px}
.summary b{display:block;font-family:var(--f-mono);font-size:18px}

/* 뽀모도로 */
.pomo .time{font-family:var(--f-mono);font-size:42px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.track{height:5px;background:var(--bg);border-radius:3px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .9s linear}
.pomo .ctrl{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* 채팅·활동 */
.ptabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.ptabs button{background:none;border:0;padding:6px 10px;border-bottom:2px solid transparent;font-weight:600;color:var(--muted);margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ptabs .cnt{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:3px}
.list{height:330px;overflow-y:auto;display:flex;flex-direction:column}
.msg{display:flex;flex-direction:column;gap:2px;padding:6px 0;max-width:88%}
.msg .who{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.msg .who i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.msg .who .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.msg .tx{background:var(--bg);border-radius:4px 12px 12px 12px;padding:7px 10px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .tx{background:var(--accent);color:var(--accent-fg);border-radius:12px 4px 12px 12px}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .tx{background:none;color:var(--muted);font-size:12px;padding:2px 0;text-align:center}
.chatform{display:flex;gap:6px;margin-top:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.feed .it{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:start}
.feed .it:first-child{border-top:0}
.feed .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.feed .hash{font-family:var(--f-mono);font-size:12px;color:var(--accent)}

/* 일정·출석 */
.rule-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rule-line .r{font-size:18px;font-weight:700}
.rule-line .r .mono{font-weight:600}
.rule-line .btn{margin-left:auto}
.sess{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.sess:first-of-type{border-top:0}
.sess .d{font-weight:700} .sess .t{font-size:12.5px;color:var(--muted)}
.sess.today .d{color:var(--accent)}
.sess .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sess.off .d,.sess.off .t{opacity:.55}
.strike{text-decoration:line-through}
@media (max-width:560px){.sess{grid-template-columns:minmax(0,1fr)}.sess .acts{justify-content:flex-start}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);font-size:13px}
.seg button:first-child{border-left:0}
.seg button.on[data-v="yes"]{background:var(--ok-weak);color:var(--ok)}
.seg button.on[data-v="late"]{background:var(--warn-weak);color:var(--warn)}
.seg button.on[data-v="no"]{background:var(--bad-weak);color:var(--bad)}
.figs{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.figs b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600}
.figs span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.att{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
table.att th,table.att td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.att th{font-weight:600;color:var(--muted);font-size:11.5px}
table.att th:first-child,table.att td:first-child{text-align:left;padding-left:0}
table.att td.n{font-family:var(--f-mono)}
.mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:700}
.mk.O{background:var(--ok-weak);color:var(--ok)} .mk.L{background:var(--warn-weak);color:var(--warn)}
.mk.X{background:var(--bad-weak);color:var(--bad)} .mk.E{background:var(--bg);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* 알림 */
.tog{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.tog .tx{flex:1;min-width:0}
.tog .tx b{display:block;font-weight:600}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:11px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.preview{font-family:var(--f-mono);font-size:12px;background:var(--bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{display:flex;gap:6px}
.copy input{font-family:var(--f-mono);font-size:12px}

/* 모달 · 토스트 · 바닥글 */
.backdrop{position:fixed;inset:0;background:rgba(10,14,24,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal .hero{border-radius:12px;background:linear-gradient(180deg,var(--wall-top),var(--wall-bot));display:grid;place-items:end center;height:150px;padding-bottom:6px}
.modal .hero svg{width:160px;height:134px;overflow:visible}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.opts{display:flex;gap:6px}
.opts label{flex:1;display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
footer.foot{border-top:1px solid var(--line);background:var(--surface)}
footer.foot div{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,.ch *{animation:none!important;transition:none!important}}

  '박서연':{file:'Main.java',code:['public class Main {','    static long[] tree;','    static long[] lazy;','','    static void update(int node, int s, int e, int l, int r, long v) {','        push(node, s, e);','        if (r < s || e < l) return;','        if (l <= s && e <= r) {','            lazy[node] += v;','            push(node, s, e);','            return;','        }','        int mid = (s + e) / 2;','        update(node * 2, s, mid, l, r, v);','        update(node * 2 + 1, mid + 1, e, l, r, v);','        tree[node] = tree[node * 2] + tree[node * 2 + 1];','    }','}']},
  cs:{file:'ThreadPoolDemo.java',code:['public class ThreadPoolDemo {','    public static void main(String[] args) throws Exception {','        ExecutorService pool = Executors.newFixedThreadPool(4);','        List<Future<Integer>> results = new ArrayList<>();','','        for (int i = 0; i < 8; i++) {','            int id = i;','            results.add(pool.submit(() -> work(id)));','        }','        // 스레드는 4개, 작업은 8개','        for (Future<Integer> f : results) {','            System.out.println(f.get());','        }','        pool.shutdown();','    }','}']},
  algo:{file:'Main.java',code:['public class Main {','    public static void main(String[] args) throws IOException {','        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));','        int n = Integer.parseInt(br.readLine());','        int[][] dp = new int[n][n];','','        for (int i = 0; i < n; i++) {','            StringTokenizer st = new StringTokenizer(br.readLine());','            for (int j = 0; j <= i; j++) {','                int v = Integer.parseInt(st.nextToken());','                // 위에서 내려오는 두 경로 중 큰 값','                int up = i > 0 ? Math.max(get(dp, i - 1, j - 1), get(dp, i - 1, j)) : 0;','                dp[i][j] = up + v;','            }','        }','    }','}']},
  side:{file:'AuthController.java',code:['@RestController','@RequestMapping("/api/auth")','public class AuthController {','','    private final AuthService authService;','','    @PostMapping("/login")','    public ResponseEntity<LoginResponse> login(@RequestBody LoginRequest req) {','        LoginResponse res = authService.login(req.email(), req.password());','        return ResponseEntity.ok(res);','    }','}']}

const KW=new Set(['public','private','static','final','class','void','int','long','return','for','if','new','throws','import','package','true','false','null','this']);
function hl(line){return line.split(/("(?:[^"\\]|\\.)*"|\/\/.*$|@?\b[A-Za-z_]\w*\b|\b\d+\b)/).map(t=>{if(!t)return '';const e=esc(t);
  if(t[0]==='"')return `<span class="st">${e}</span>`;if(t.startsWith('//'))return `<span class="cm">${e}</span>`;if(/^\d+$/.test(t))return `<span class="nu">${e}</span>`;
  if(KW.has(t))return `<span class="kw">${e}</span>`;if(t[0]==='@')return `<span class="an">${e}</span>`;if(/^[A-Z]/.test(t))return `<span class="ty">${e}</span>`;return e}).join('')}

function openRoom(g,at){
  const s=SEED[g.id];
  rooms[g.id]={live:true,t0:T,simStart:toSec(s.start),
    people:s.people.map(p=>({n:p.n,c:g.members[p.n],st:p.st,todos:p.todos.map(([t,d])=>({t,done:!!d})),commits:p.commits,join:p.join,in:p.join===0,share:!!p.share})),
    me:{in:false,c:g.members[ME],st:'focus',todos:[],commits:0,first:null,inAt:0,out:null,share:false},
    watch:null,cur:4,viewers:{},
    pomo:{...s.pomo,parts:[...s.pomo.parts],saved:{}},
    chat:s.chat.map(([t,n,x])=>({t,n,x})),feed:[],unread:0,pane:'chat'};
  const r=rooms[g.id];
  r.people.forEach(p=>{if(p.share)r.viewers[p.n]=1});
  r.feed=[{t:hm(r.simStart-120),h:`제${occ(g,1)[0].no}회 방이 열렸습니다`}];
  r.people.filter(p=>p.in).forEach(p=>r.feed.unshift({t:hm(r.simStart-60),h:`<b>${esc(p.n)}</b> 입장 · ${esc(p.todos[0]?.t||'')}`}));
  return r;
}

function occ(g,n){const out=[];const d=new Date(TODAY);let no=g.baseNo,k=0;
  while(out.length<n&&k++<120){if(g.rule.days.includes(d.getDay()))out.push({date:ymd(d),no:no++});d.setDate(d.getDate()+1)}return out}
function hashStr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function rsvpFor(g,date){const key=g.id+date;
  if(!S.rsvp[key]){const o={};const pool=['yes','yes',null,'yes','late','yes','no'];Object.keys(g.members).forEach((m,i)=>o[m]=m===ME?null:pool[(hashStr(key)+i*3)%pool.length]);S.rsvp[key]=o}
  return S.rsvp[key]}
const ruleText=r=>{const d=[...r.days].sort();if(d.join()==='1,2,3,4,5')return '평일';return '매주 '+d.map(x=>DAY[x]).join('·')};
function untilText(g){const o=occ(g,1)[0];const today=o.date===ymd(TODAY);
  if(today){const w=toSec(g.rule.start)-nowSec();if(w>0)return `오늘 ${g.rule.start} · ${Math.floor(w/3600)?Math.floor(w/3600)+'시간 ':''}${Math.floor(w%3600/60)}분 뒤`}
  const n=today?occ(g,2)[1]:o;return `${mdw(n.date)} ${g.rule.start}`}
function rateOf(g){const all=Object.values(g.history.marks).join('').split('').filter(c=>c!=='E');return Math.round(all.filter(c=>c!=='X').length/all.length*100)}

  m.addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('[data-x]'))closeModal()});onMount&&onMount(m);const f=m.querySelector('input:not([type=radio]),select');f&&f.focus()}

function simulate(){
  const r=R();const g=G();const others=r.people.filter(p=>p.in);if(!others.length)return;
  const p=pick(others);const x=Math.random();const inFocus=r.pomo.run&&r.pomo.mode==='집중'&&r.pomo.parts.includes(p.n);
  if(x<.32){p.commits++;fx(p.n,'commit');addFeed(`<b>${esc(p.n)}</b> 커밋 <span class="hash">${hex()}</span> ${esc(pick(COMMITS[g.id]))}`,p.n);paintHead()}
  else if(x<.56){if(inFocus&&Math.random()<.6)return;addChat(p.n,pick(CHAT[g.id]))}
  else if(x<.72&&!inFocus){const ns=pick(['focus','focus','ask','rest','stuck']);if(ns===p.st)return;p.st=ns;
    if(ns==='stuck'&&!p.share){p.share=true;r.viewers[p.n]=0;addFeed(`<b>${esc(p.n)}</b> 화면 공유 시작`)}
    else if(ns!=='stuck'&&p.share&&Math.random()<.4){p.share=false;addFeed(`<b>${esc(p.n)}</b> 화면 공유 종료`)}
    paintSeat(p.n);paintStage();addFeed(`<b>${esc(p.n)}</b> 상태 · ${SL[ns]}`);
    if(ns==='stuck'){setTimeout(()=>{if(R()===r&&p.st==='stuck')addChat(p.n,'화면 공유 켰어요. 여기서 막혔는데 잠깐 봐주실 분?')},800)}}
  else if(x<.88){const t=p.todos.find(t=>!t.done);if(!t)return;t.done=true;fx(p.n,'text','할 일 완료');paintSeat(p.n);addFeed(`<b>${esc(p.n)}</b> 할 일 완료 · ${esc(t.t)}`,p.n);paintHead()}
  else if(r.me.in&&!r.me.out){fx(ME,'cheer',p.n);addFeed(`<b>${esc(p.n)}</b> 님이 나에게 응원을 보냈어요`)}
}

}
function excModal(date,no){
  const g=G();const key=g.id+date;const ex=S.exc[key];const r=g.rule;
  modal(`<h3>${mdw(date)} 제${no}회만 변경</h3>
    <div class="opts" id="exOpts"><label><input type="radio" name="ex" value="move" checked> 시간 변경</label><label><input type="radio" name="ex" value="cancel"> 이번 회차 취소</label></div>
    <div class="two" id="mvRow"><div class="field"><label for="mvS">시작</label><input type="time" id="mvS" value="${ex?.start||r.start}"></div><div class="field"><label for="mvE">종료</label><input type="time" id="mvE" value="${ex?.end||r.end}"></div></div>
    <div class="field"><label for="exReason">사유</label><input type="text" id="exReason" maxlength="40" placeholder="예: 중간 평가 주간" value="${esc(ex?.reason||'')}"></div>
    <p class="note">참석으로 응답한 멤버에게 변경 알림이 갑니다. 정기 일정은 그대로입니다.</p>
    <div class="foot">${ex?'<button class="btn danger" id="exReset" style="margin-right:auto">원래대로</button>':''}<button class="btn" data-x="1">닫기</button><button class="btn pri" id="exSave">적용</button></div>`,m=>{
    m.querySelector('#exOpts').addEventListener('change',e=>{m.querySelector('#mvRow').hidden=e.target.value!=='move'});
    const rs=m.querySelector('#exReset');if(rs)rs.onclick=()=>{delete S.exc[key];closeModal();render();toast('원래 일정으로 되돌렸어요')};
    m.querySelector('#exSave').onclick=()=>{const v=m.querySelector('input[name=ex]:checked').value;const reason=m.querySelector('#exReason').value.trim();
      if(v==='cancel')S.exc[key]={type:'cancel',reason};
      else{const s=m.querySelector('#mvS').value,e=m.querySelector('#mvE').value;if(toSec(e)<=toSec(s))return toast('종료 시각이 시작보다 늦어야 합니다');S.exc[key]={type:'move',start:s,end:e,reason}}
      closeModal();render();toast(`${mdw(date)} 회차를 바꿨어요`)};
  });
}
function newGroupModal(){
  let days=[2,4];
  modal(`<h3>새 그룹 만들기</h3><div class="field"><label for="gn">그룹 이름</label><input type="text" id="gn" maxlength="24" placeholder="예: 백엔드 면접 스터디"></div>
    <div class="field"><label>요일</label><div class="days" id="dayBtns">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-d="${d}" class="${days.includes(d)?'on':''}" aria-pressed="${days.includes(d)}">${DAY[d]}</button>`).join('')}</div></div>
    <div class="two"><div class="field"><label for="gs">시작</label><input type="time" id="gs" value="20:00"></div><div class="field"><label for="ge">종료</label><input type="time" id="ge" value="22:00"></div></div>
    <div class="foot"><button class="btn" data-x="1">닫기</button><button class="btn pri" id="mk">만들기</button></div>`,m=>{
    m.querySelector('#dayBtns').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;days=days.includes(d)?days.filter(x=>x!==d):[...days,d];b.classList.toggle('on');b.setAttribute('aria-pressed',days.includes(d))});
    m.querySelector('#mk').onclick=()=>{const name=m.querySelector('#gn').value.trim();const s=m.querySelector('#gs').value,e=m.querySelector('#ge').value;
      if(!name)return toast('그룹 이름을 적어 주세요');if(!days.length)return toast('요일을 하나 이상 고르세요');if(toSec(e)<=toSec(s))return toast('종료 시각이 시작보다 늦어야 합니다');
      groups.push({id:'g'+groups.length,name,rule:{days,start:s,end:e,min:2,deadline:60},baseNo:1,streak:0,members:{[ME]:COLORS[0]},history:{dates:[],marks:{[ME]:''}}});
      closeModal();render();toast(`${name} 그룹을 만들었어요. 초대 링크로 멤버를 부르세요`)};
  });
}

/* ---------- 이벤트 ---------- */
const main=document.getElementById('main');
main.addEventListener('click',e=>{
  const sw=e.target.closest('#sw [data-c]');if(sw){const r=R();r.me.c=sw.dataset.c;document.querySelectorAll('#sw [data-c]').forEach(b=>b.setAttribute('aria-pressed',b===sw));document.getElementById('pv').innerHTML=charSVG(r.me.c,'focus');return}
  const pt=e.target.closest('[data-pane]');if(pt){R().pane=pt.dataset.pane;paintPane();return}
  const q=e.target.closest('[data-q]');if(q){sendChat(q.dataset.q);return}
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const g=G();const r=R();
  if(a==='openGroup'){S.g=+b.dataset.i;S.view='group';S.tab='room';render();window.scrollTo(0,0);return}
  if(a==='newGroup')return newGroupModal();
  if(a==='joinGroup')return modal(`<h3>초대 코드로 참여</h3><div class="field"><label for="code">초대 코드</label><input type="text" id="code" maxlength="12" placeholder="예: 7QK2XP" class="mono"></div><div class="foot"><button class="btn" data-x="1">닫기</button><button class="btn pri" id="go">참여</button></div>`,m=>{m.querySelector('#go').onclick=()=>{closeModal();toast('목업에서는 예시 그룹 세 개만 있어요')}});
  if(a==='demoOpen'){openRoom(g);render();return}
  if(a==='enter'){const t=document.getElementById('todoIn').value.trim();if(!t){toast('오늘 할 일을 한 줄 적어 주세요');document.getElementById('todoIn').focus();return}
    Object.assign(r.me,{in:true,todos:[{t,done:false}],inAt:T,st:'focus'});paintSeats();paintMe();paintPomo();paintHead();fx(ME,'text','안녕하세요');addFeed(`<b>나</b> 입장 · ${esc(t)}`);sysChat('나 님이 들어왔어요');return}
  if(a==='setSt'){r.me.st=b.dataset.st;paintSeat(ME);paintMe();addFeed(`<b>나</b> 상태 · ${SL[r.me.st]}`);
    if(r.me.st==='stuck')setTimeout(()=>{const h=r.people.find(p=>p.in&&p.st==='ask')||r.people.find(p=>p.in);if(h&&R()===r){addChat(h.n,'어디서 막혔어요? 코드 링크 주세요');}},2500);return}
  if(a==='addTodo'){const i=document.getElementById('addTodo');const t=i.value.trim();if(!t)return;r.me.todos.push({t,done:false});paintMe();paintSeat(ME);paintHead();document.getElementById('addTodo').focus();return}
  if(a==='myCommit'){r.me.commits++;if(!r.me.first)r.me.first=hm(rNow(r));fx(ME,'commit');addFeed(`<b>나</b> 커밋 <span class="hash">${hex()}</span> ${esc(pick(COMMITS[g.id]))}`);paintMe();paintHead();
    setTimeout(()=>{const p=r.people.find(x=>x.in);if(p&&R()===r&&Math.random()<.7){fx(ME,'cheer',p.n);addFeed(`<b>${esc(p.n)}</b> 님이 나의 커밋을 응원했어요`)}},1800);return}
  if(a==='char')return charModal(b.dataset.name);
  if(a==='share'){if(r.me.share){r.me.share=false;if(r.watch===ME)r.watch=null;paintSeat(ME);paintStage();paintMe();addFeed('<b>나</b> 화면 공유 종료');sysChat('나 님이 화면 공유를 멈췄어요')}else shareModal();return}
  if(a==='watch'){r.watch=b.dataset.name;paintStage();return}
  if(a==='unwatch'){r.watch=null;paintStage();return}
  if(a==='bigScreen'){const n=r.watch;if(!n)return;modal(`<div class="sh" style="display:flex;align-items:center;gap:10px"><span class="livetag">LIVE</span><b>${n===ME?'내 화면':esc(n)+' 님의 화면'}</b><button class="btn sm" data-x="1" style="margin-left:auto">닫기</button></div><div id="bigScreenBody">${screenHTML(n,r.cur,true)}</div>`);document.querySelector('#modalRoot .modal').classList.add('wide');return}
  if(a==='cheerFeed'){const f=r.feed[+b.dataset.i];f.cheered=1;fx(f.cheer,'cheer');paintPane();return}
  if(a==='pomoStart'){Object.assign(r.pomo,{run:true,mode:'집중',left:1500,by:ME,parts:[ME]});r.me.st='focus';sysChat('나 님이 25분 집중을 시작했어요. 같이 하기를 누르면 타이머가 맞춰집니다');addFeed('<b>나</b> 뽀모도로 시작');paintPomo();paintSeats();paintMe();
    setTimeout(()=>{const fr=r.people.filter(p=>p.in&&!r.pomo.parts.includes(p.n)).slice(0,2);fr.forEach(p=>{r.pomo.parts.push(p.n);p.st='focus'});if(fr.length&&R()===r){sysChat(`${fr.map(p=>p.n).join(', ')} 님이 같이 해요`);paintPomo();paintSeats()}},2500);return}
  if(a==='pomoJoin'){const i=r.pomo.parts.indexOf(ME);if(i>=0)r.pomo.parts.splice(i,1);else{r.pomo.parts.push(ME);if(r.pomo.mode==='집중')r.me.st='focus';else{r.pomo.saved[ME]=r.me.st;r.me.st='rest'}sysChat('나 님이 뽀모도로에 참여했어요')}paintPomo();paintSeats();paintMe();return}
  if(a==='pomoSkip'){r.pomo.left=1;return}
  if(a==='checkout'){const me=r.me;modal(`<h3>체크아웃</h3><ul class="todos">${me.todos.map(t=>`<li class="${t.done?'done':''}"><span class="mono small">${t.done?'✓':'·'}</span><label>${esc(t.t)}</label></li>`).join('')}</ul>
      <div class="field"><label for="retro">회고 한 줄</label><input type="text" id="retro" maxlength="80" placeholder="예: 격리 수준 표는 끝, MVCC는 다음 회차"></div>
      <div class="foot"><button class="btn" data-x="1">닫기</button><button class="btn pri" id="out">체크아웃</button></div>`,m=>{m.querySelector('#out').onclick=()=>{
      const first=me.first||hm(rNow(r));const mark=toSec(first)-toSec(g.rule.start)<=600?'O':'L';const stay=Math.max(60,T-me.inAt);
      me.out={mark,first,outAt:hm(rNow(r)),stay:`${Math.floor(stay/3600)}h ${p2(Math.floor(stay%3600/60))}m`,commits:me.commits,done:`${me.todos.filter(t=>t.done).length}/${me.todos.length}`,retro:m.querySelector('#retro').value.trim()};
      const i=r.pomo.parts.indexOf(ME);if(i>=0)r.pomo.parts.splice(i,1);
      me.share=false;if(r.watch===ME)r.watch=null;paintStage();
      const td=ymd(TODAY);if(!g.history.dates.includes(td)){g.history.dates.push(td);Object.keys(g.members).forEach(n=>{let k;if(n===ME)k=mark;else{const p=r.people.find(x=>x.n===n);k=!p?'X':p.in?(p.join>0?'L':'O'):'X'}g.history.marks[n]=(g.history.marks[n]||'')+k});g.streak++}
      closeModal();fx(ME,'text','다음에 또 봐요');setTimeout(()=>{paintSeats();paintHead()},900);paintMe();paintPomo();addFeed(`<b>나</b> 체크아웃 · 할 일 ${me.out.done}`);sysChat('나 님이 체크아웃했어요');toast('출석부에 오늘 기록을 남겼어요')}});return}
  if(a==='toRoom'){S.tab='room';render();return}
  if(a==='rsvp'){const rs=rsvpFor(g,b.dataset.date);rs[ME]=rs[ME]===b.dataset.v?null:b.dataset.v;render();return}
  if(a==='exc')return excModal(b.dataset.date,b.dataset.no);
  if(a==='editRule')return editRuleModal();
  if(a==='hookTest')return toast('디스코드 채널에 테스트 메시지를 보냈어요 (목업)');
});
main.addEventListener('change',e=>{
  if(e.target.dataset.todo!==undefined){const r=R();const t=r.me.todos[+e.target.dataset.todo];t.done=e.target.checked;paintMe();paintSeat(ME);paintHead();
    if(t.done){fx(ME,'text','할 일 완료');addFeed(`<b>나</b> 할 일 완료 · ${esc(t.t)}`);setTimeout(()=>{const p=r.people.find(x=>x.in);if(p&&R()===r){fx(ME,'cheer',p.n);addChat(p.n,'오 하나 끝냈네요')}},1500)}return}
  const k=e.target.dataset.notif;if(k){S.notif[k]=e.target.checked}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='addTodo'){e.preventDefault();main.querySelector('[data-action="addTodo"]').click()}
  if(e.key==='Enter'&&e.target.id==='todoIn'){e.preventDefault();main.querySelector('[data-action="enter"]').click()}});
main.addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const i=document.getElementById('chatIn');sendChat(i.value.trim());i.value=''});
function sendChat(x){
  const r=R();if(!x)return;if(!r.me.in||r.me.out){toast('입장하면 채팅할 수 있어요');return}
  addChat(ME,x);
  const mention=Object.keys(G().members).find(n=>n!==ME&&x.includes('@'+n));
  if(mention||/[?？]|질문|도와/.test(x)){setTimeout(()=>{if(R()!==r)return;const p=(mention&&r.people.find(q=>q.n===mention&&q.in))||r.people.find(q=>q.in&&q.st==='ask')||r.people.find(q=>q.in);if(p)addChat(p.n,pick(REPLY))},2600)}
  else if(Math.random()<.4){setTimeout(()=>{if(R()!==r)return;const p=pick(r.people.filter(q=>q.in));if(p)addChat(p.n,pick(['좋아요','화이팅','저도요']))},2200)}
}
render();
</script>
