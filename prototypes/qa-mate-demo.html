<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA메이트</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#1b1b21;--muted:#6b6b78;--line:#e3e3ea;--accent:#4f46e5;--soft:#eef0ff;--bad:#c2410c;--bad-soft:#fff2e9;--ok:#15803d;--warn:#8a6d00;--warn-soft:#fff9db}
@media (prefers-color-scheme:dark){:root{--bg:#121216;--card:#1c1c22;--text:#ececf1;--muted:#9a9aa8;--line:#2e2e37;--accent:#8b85ff;--soft:#25234a;--bad:#ff8a4c;--bad-soft:#3a2216;--ok:#4ade80;--warn:#e6c34a;--warn-soft:#352d10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
.nav{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px;color:var(--accent)}
.user{font-size:13px;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:24px;margin:0 0 4px}h3{font-size:17px;margin:0 0 10px}h4{margin:18px 0 8px;font-size:14px}
.muted,small{color:var(--muted)}small{font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.stepper{display:flex;gap:6px;margin:16px 0;font-size:13px;flex-wrap:wrap}
.stepper span{padding:3px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--line);background:var(--card)}
.stepper .cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.stepper .past{color:var(--accent);border-color:var(--accent)}
label.f{display:block;font-weight:600;font-size:13px;margin:16px 0 4px}
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.field:disabled{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.chip{border-radius:99px;padding:4px 12px;font-size:13px;margin:0 6px 6px 0}
button.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.consent{display:flex;gap:8px;align-items:flex-start;margin:20px 0 16px;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;cursor:pointer}
.note{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px;background:var(--soft)}
.note.error{background:var(--bad-soft);color:var(--bad);font-weight:600}
.cat{margin-top:16px}.cat h4{margin:0 0 6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.item.off{opacity:.6}
.sw{min-width:56px;padding:3px 0;font-size:12px;font-weight:700}.sw.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.anim i{width:0;animation:fill 2.2s linear forwards}@keyframes fill{to{width:100%}}
.log{font:13px/1.7 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto}
.log .bad{color:var(--bad)}.log .skip{color:var(--warn)}.log .ok{color:var(--muted)}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.grade{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.grade b{display:block;font-size:28px;line-height:1.2}.grade.none b{color:var(--muted);font-size:20px;line-height:1.9}
.finding{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;width:100%;text-align:left}
.finding.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.sev.high{background:var(--bad-soft);color:var(--bad)}.sev.mid{background:var(--warn-soft);color:var(--warn)}.sev.low{background:var(--line);color:var(--muted)}
.insight{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.evidence{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.browser{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px}
.browser .url{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.rec{color:var(--bad);font-weight:700}
.frame{padding:26px 20px;min-height:100px;font-size:16px;text-align:center;display:flex;align-items:center;justify-content:center}
.frame.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.ts{padding:8px 16px 0;font-size:12px;color:var(--muted)}
.repro{font-size:14px;padding:0 16px 12px}
@media (max-width:640px){.grades{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="nav"><span class="logo">QA메이트</span><span class="user">7반 A301팀</span></div></header>
<main><div class="stepper" id="stepper"></div><div id="app"></div></main>

<!-- 핵심 로직: DOM에 의존하지 않는 순수 모듈. (상태, 행동) => 새 상태 -->
<script>
const QA = (() => {
  const CATS = [{ id: 'func', label: '기능' }, { id: 'edge', label: '엣지 케이스' }, { id: 'net', label: '네트워크' },
    { id: 'perf', label: '성능' }, { id: 'sec', label: '보안' }];
  const SEV = { high: { label: '높음', penalty: 25 }, mid: { label: '중간', penalty: 12 }, low: { label: '낮음', penalty: 5 } };
  const FORBIDDEN = ['회원 탈퇴', '결제', '관리자 페이지 접근'];
  const STEPS = [['register', '1 등록'], ['analyze', '2 AI 분석'], ['plan', '3 계획 검토'], ['run', '4 실행'], ['report', '5 리포트']];
  const TEAM = { name: '7반 A301팀', domain: 'i13a301.p.ssafy.io' };

  const PLAN = [
    { id: 'f1', cat: 'func', title: '회원가입·로그인 흐름', on: true },
    { id: 'f2', cat: 'func', title: '스터디 만들기·참여·나가기', on: true },
    { id: 'f3', cat: 'func', title: '계정 관리 (정보 수정·회원 탈퇴)', on: true, forbidKey: '회원 탈퇴' },
    { id: 'e1', cat: 'edge', title: '정원 경계값·동시 참여', on: true },
    { id: 'e2', cat: 'edge', title: '아주 긴 입력·이모지·특수문자', on: true },
    { id: 'n1', cat: 'net', title: '실시간 채팅 끊김·재연결', on: true, detail: '집중 요청 반영: "채팅이 가끔 끊기는 것 같아요"' },
    { id: 'n2', cat: 'net', title: '실패하는 요청·브라우저 에러 수집', on: true },
    { id: 'p1', cat: 'perf', title: '페이지 로딩 속도·리소스 크기', on: true },
    { id: 'p2', cat: 'perf', title: '기능별 응답 시간', on: true },
    { id: 'p3', cat: 'perf', title: '소규모 동시 접속', on: false, consent: true, detail: '조회 기능 4개만 · 최대 20명 · 응답이 2초를 넘으면 자동 중단' },
    { id: 's1', cat: 'sec', title: '로그인·세션 기본 점검', on: true },
    { id: 's2', cat: 'sec', title: '다른 사용자 데이터 접근 권한 점검', on: true, needAccounts: 2, detail: '테스트 계정이 2개 있어야 가능' },
    { id: 's3', cat: 'sec', title: '입력값 검증 심화 점검', on: false, consent: true, detail: '테스트 데이터가 생길 수 있어 별도 동의 필요' },
  ];

  const FINDINGS = {
    f2: { sev: 'high', title: '정원이 다 찬 스터디에서 "참여하기"가 계속 눌림', url: '/study/42',
      repro: ['정원 5명 스터디가 "모집 완료"가 된다', '6번째 계정으로 "참여하기"를 누른다', '참여가 성공해 6/5명이 된다'],
      frames: [['0:00', '정원 5/5 · "모집 완료" 표시'], ['0:03', '"참여하기" 버튼이 여전히 눌리는 상태'], ['0:05', '눌렀더니 참여 성공 → 6/5명', 1]] },
    e1: { sev: 'high', insight: 1, title: '두 명이 동시에 마지막 자리에 참여하면 정원 초과 (6/5명)', url: '/study/42',
      repro: ['4/5명 스터디를 두 계정이 함께 연다', '0.1초 차이로 "참여하기"를 누른다', '둘 다 성공해서 6/5명이 된다'],
      frames: [['0:00', '4/5명 · 계정 A, B가 같은 화면을 보는 중'], ['0:02', 'A와 B가 거의 동시에 "참여하기"'], ['0:03', '둘 다 성공 → 6/5명', 1]] },
    e2: { sev: 'low', insight: 1, title: '제목에 500자·이모지를 넣으면 목록 카드가 화면 밖으로 넘침', url: '/study',
      repro: ['스터디 제목에 500자와 이모지를 넣어 만든다', '스터디 목록으로 이동한다', '카드가 옆 카드를 덮고 넘친다'],
      frames: [['0:00', '제목 500자 입력 후 저장'], ['0:04', '목록 카드가 가로로 넘쳐 레이아웃이 깨짐', 1]] },
    n1: { sev: 'mid', title: '채팅 연결이 끊긴 뒤 자동으로 다시 연결되지 않음', url: '/study/42/chat',
      repro: ['채팅방에서 메시지를 주고받는다', '네트워크를 10초간 끊었다가 복구한다', '새 메시지가 오지 않고 새로고침해야 복구된다'],
      frames: [['0:00', '채팅 정상 송수신'], ['0:10', '네트워크 10초 차단 후 복구'], ['0:25', '상대 메시지가 15초째 안 보임', 1]] },
    p1: { sev: 'mid', title: '메인 첫 화면 표시까지 6.8초 (배너 이미지 4.2MB)', url: '/',
      repro: ['캐시 없이 메인 페이지에 접속한다', '첫 화면까지 6.8초 걸린다 (권장 2.5초 이내)', '원인: 압축하지 않은 배너 이미지 4.2MB'],
      frames: [['0:00', '접속 시작 · 빈 화면'], ['0:04', '아직 배너 이미지를 받는 중'], ['0:07', '6.8초 만에 첫 화면 표시', 1]] },
    p3: { sev: 'mid', title: '동시 접속 15명에서 스터디 목록 응답이 2.3초로 느려짐', url: '/study',
      repro: ['동시 접속을 5명 → 10명 → 15명으로 늘린다', '15명에서 목록 응답이 2.3초가 된다', '기준(2초)을 넘어 자동 중단했다'],
      frames: [['0:00', '5명 · 응답 0.4초'], ['0:30', '10명 · 응답 1.1초'], ['1:00', '15명 · 응답 2.3초 → 자동 중단', 1]] },
  };

  const init = () => ({ step: 'register', accounts: 2, forbidden: [], agreed: false,
    plan: PLAN.map(p => ({ ...p })), done: 0, log: [], error: '' });
  const runList = s => s.plan.filter(p => p.on);
  const skipped = (s, p) => p.forbidKey && s.forbidden.includes(p.forbidKey);

  function reduce(s, a) {
    s = { ...s, error: '' };
    switch (a.type) {
      case 'reset': return init();
      case 'forbid': return { ...s, forbidden: s.forbidden.includes(a.v) ? s.forbidden.filter(x => x !== a.v) : [...s.forbidden, a.v] };
      case 'accounts': return { ...s, accounts: a.n };
      case 'agree': return { ...s, agreed: !s.agreed };
      case 'submit':
        if (!s.agreed) return { ...s, error: '동의서에 체크해야 QA를 요청할 수 있습니다.' };
        return { ...s, step: 'analyze', plan: s.plan.map(p => p.needAccounts > s.accounts ? { ...p, on: false } : p) };
      case 'analyzed': return s.step === 'analyze' ? { ...s, step: 'plan' } : s;
      case 'toggle': {
        const p = s.plan.find(x => x.id === a.id);
        if (!p.on && p.needAccounts > s.accounts) return { ...s, error: `"${p.title}"는 테스트 계정이 ${p.needAccounts}개 있어야 켤 수 있습니다.` };
        return { ...s, plan: s.plan.map(x => x.id === a.id ? { ...x, on: !x.on } : x) };
      }
      case 'approve':
        if (!runList(s).length) return { ...s, error: '켜진 검사 항목이 하나도 없습니다.' };
        return { ...s, step: 'run', done: 0, log: [] };
      case 'tick': {
        if (s.step !== 'run') return s;
        const list = runList(s), p = list[s.done];
        const line = skipped(s, p) ? { k: 'skip', t: `⏭ ${p.title} — 금지 행동(${p.forbidKey})이라 건너뜀` }
          : FINDINGS[p.id] ? { k: 'bad', t: `⚠ ${p.title} — 문제 발견` } : { k: 'ok', t: `✓ ${p.title} — 이상 없음` };
        const done = s.done + 1;
        return { ...s, done, log: [...s.log, line], step: done === list.length ? 'report' : 'run' };
      }
    }
    return s;
  }

  const gradeOf = n => n >= 90 ? 'A' : n >= 75 ? 'B' : n >= 60 ? 'C' : n >= 40 ? 'D' : 'F';
  function report(s) {
    return CATS.map(c => {
      const ran = s.plan.filter(p => p.cat === c.id && p.on && !skipped(s, p));
      const found = ran.filter(p => FINDINGS[p.id]).map(p => ({ id: p.id, ...FINDINGS[p.id] }))
        .sort((a, b) => SEV[b.sev].penalty - SEV[a.sev].penalty);
      const score = 100 - found.reduce((n, f) => n + SEV[f.sev].penalty, 0);
      const note = !ran.length ? '검사하지 않았습니다' : !found.length ? '발견된 문제 없음'
        : `${found.length}건 발견 · 최고 심각도 ${SEV[found[0].sev].label}`;
      return { ...c, grade: ran.length ? gradeOf(score) : null, note, found };
    });
  }
  return { CATS, SEV, FORBIDDEN, STEPS, TEAM, init, reduce, report, runList };
})();
</script>

<!-- 화면: 순수 모듈을 호출만 하는 얇은 껍데기 -->
<script>
const $ = id => document.getElementById(id);
let S = QA.init(), sel = null, timer = null;

function dispatch(a) {
  const prev = S.step;
  S = QA.reduce(S, a);
  if (a.type === 'reset') sel = null;
  if (S.step !== prev) {
    clearInterval(timer);
    if (S.step === 'analyze') timer = setTimeout(() => dispatch({ type: 'analyzed' }), 2300);
    if (S.step === 'run') timer = setInterval(() => dispatch({ type: 'tick' }), 750);
  }
  render();
}

const chips = (list, on, act) => list.map(x => `<button class="chip ${on(x) ? 'on' : ''}" data-a='${JSON.stringify(act(x))}'>${x}</button>`).join('');

function render() {
  const cur = QA.STEPS.findIndex(x => x[0] === S.step);
  $('stepper').innerHTML = QA.STEPS.map((x, i) => `<span class="${i === cur ? 'cur' : i < cur ? 'past' : ''}">${x[1]}</span>`).join('');
  const err = S.error ? `<div class="note error">${S.error}</div>` : '';
  let h = '';

  if (S.step === 'register') {
    h = `<h1>QA 요청하기</h1><p class="muted">서비스 정보를 입력하면 AI가 분석하고 QA 계획을 세웁니다.</p>${err}<div class="card">
      <label class="f" style="margin-top:0">서비스 주소 <small>· 우리 팀 도메인이 자동으로 입력됩니다</small></label>
      <input class="field" disabled value="https://${QA.TEAM.domain}">
      <label class="f">서비스 소개</label><input class="field" value="스터디 모임을 만들고 참여하는 웹 서비스 (로그인, 게시글, 실시간 채팅)">
      <label class="f">테스트 계정 개수 <small>· 2개 이상 권장 (다른 사용자 데이터 접근 점검에 필요)</small></label>
      ${chips([1, 2, 3], n => n === S.accounts, n => ({ type: 'accounts', n }))}
      <label class="f">금지 행동 <small>· AI가 하면 안 되는 행동</small></label>
      ${chips(QA.FORBIDDEN, v => S.forbidden.includes(v), v => ({ type: 'forbid', v }))}
      <label class="f">집중해서 볼 부분</label><input class="field" value="채팅이 가끔 끊기는 것 같아요">
      <div class="consent" data-a='{"type":"agree"}'><input type="checkbox" ${S.agreed ? 'checked' : ''} style="pointer-events:none">
        <span>우리 팀 서비스이며, AI가 테스트 계정으로 서비스를 조작하고 테스트 데이터가 생길 수 있음에 동의합니다.</span></div>
      <button class="primary" data-a='{"type":"submit"}'>QA 요청하기</button></div>`;
  } else if (S.step === 'analyze') {
    h = `<h1>서비스를 분석하는 중</h1><p class="muted">AI가 페이지를 둘러보고 기능을 파악하고 있습니다.</p>
      <div class="card"><div class="bar anim"><i></i></div><p class="muted" style="margin:0">https://${QA.TEAM.domain} 접속 · 페이지 구조 확인 · 기능 목록 정리</p></div>`;
  } else if (S.step === 'plan') {
    h = `<h1>QA 계획 검토</h1><p class="muted">AI가 서비스에서 페이지 7개, 기능 12개, 실시간 채팅 1개를 찾았습니다. 항목을 켜고 끈 뒤 승인하면 검사를 시작합니다.</p>${err}<div class="card">
      ${QA.CATS.map(c => `<div class="cat"><h4>${c.label}</h4>${S.plan.filter(p => p.cat === c.id).map(p => `
        <div class="item ${p.on ? '' : 'off'}"><button class="sw ${p.on ? 'on' : ''}" data-a='{"type":"toggle","id":"${p.id}"}'>${p.on ? '켜짐' : '꺼짐'}</button>
        <div>${p.title}${p.consent ? '<span class="tag">별도 동의</span>' : ''}${p.forbidKey && S.forbidden.includes(p.forbidKey) ? '<span class="tag">금지 행동 → 건너뜀</span>' : ''}
        ${p.detail ? `<br><small>${p.detail}</small>` : ''}</div></div>`).join('')}</div>`).join('')}
      <p style="margin:20px 0 0"><button class="primary" data-a='{"type":"approve"}'>계획 승인하고 검사 시작</button></p></div>`;
  } else if (S.step === 'run') {
    const n = QA.runList(S).length;
    h = `<h1>검사 진행 중</h1><p class="muted">${S.done} / ${n} 항목 완료</p>
      <div class="card"><div class="bar"><i style="width:${S.done / n * 100}%"></i></div>
      <div class="log">${S.log.map(l => `<div class="${l.k}">${l.t}</div>`).join('') || '<div class="ok">시작하는 중…</div>'}</div></div>`;
  } else {
    const rep = QA.report(S), all = rep.flatMap(c => c.found).sort((a, b) => QA.SEV[b.sev].penalty - QA.SEV[a.sev].penalty);
    const f = all.find(x => x.id === sel);
    h = `<h1>QA 리포트</h1><div class="meta"><span>https://${QA.TEAM.domain}</span><span>검사 항목 ${QA.runList(S).length}개</span><span>소요 시간 4분 12초</span></div>
      <div class="card"><div class="grades" style="margin-top:0">${rep.map(c => `<div class="grade ${c.grade ? '' : 'none'}"><b>${c.grade ?? '미검사'}</b>${c.label}<br><small>${c.note}</small></div>`).join('')}</div>
      <h4>발견된 문제 ${all.length}건 <small>· 눌러서 증거 보기</small></h4>
      ${all.map(x => `<button class="finding ${sel === x.id ? 'sel' : ''}" data-f="${x.id}"><span class="sev ${x.sev}">${QA.SEV[x.sev].label}</span>
        <span>${x.title}${x.insight ? '<span class="insight">💡 엣지 케이스</span>' : ''}</span></button>`).join('') || '<p class="muted">발견된 문제가 없습니다.</p>'}
      ${f ? `<div class="evidence"><div class="browser"><span class="rec">● REC</span><span class="url">${QA.TEAM.domain}${f.url}</span></div>
        ${f.frames.map(fr => `<div class="ts">${fr[0]}</div><div class="frame ${fr[2] ? 'bad' : ''}">${fr[1]}</div>`).join('')}
        <div class="repro"><b>재현 순서</b><ol>${f.repro.map(r => `<li>${r}</li>`).join('')}</ol></div></div>` : ''}
      <p style="margin:20px 0 0"><button data-a='{"type":"reset"}'>새 QA 요청</button></p></div>`;
  }
  $('app').innerHTML = h;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-f]');
  if (!el) return;
  if (el.dataset.a) dispatch(JSON.parse(el.dataset.a));
  else { sel = sel === el.dataset.f ? null : el.dataset.f; render(); }
});
render();
</script>
</body>
</html>
