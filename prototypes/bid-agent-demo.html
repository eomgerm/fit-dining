<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidLens</title>
<!-- DEMO: 서비스 화면 데모. 공고·기관·회사·수치는 모두 가상이며 서버 없이 브라우저 메모리에서만 동작한다. -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1b22;--muted:#6b6e7b;--line:#e4e5eb;--accent:#4f46e5;--accent-2:#4338ca;--soft:#eef0ff;--bad:#c2410c;--bad-soft:#fff1e8;--ok:#15803d;--ok-soft:#eafaf0;--warn:#946f00;--warn-soft:#fff8d6;--hl:#fff3a8;--hl-on:#ffe066;--paper:#fff;--shadow:0 1px 2px rgba(20,20,40,.05),0 4px 16px rgba(20,20,40,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111216;--card:#1b1c22;--text:#ececf1;--muted:#9a9cab;--line:#2c2d36;--accent:#8b85ff;--accent-2:#a5a0ff;--soft:#24224a;--bad:#ff8a4c;--bad-soft:#3a2216;--ok:#4ade80;--ok-soft:#13301f;--warn:#e6c34a;--warn-soft:#352d10;--hl:#5a4d10;--hl-on:#7a6812;--paper:#16171c;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#111216;--card:#1b1c22;--text:#ececf1;--muted:#9a9cab;--line:#2c2d36;--accent:#8b85ff;--accent-2:#a5a0ff;--soft:#24224a;--bad:#ff8a4c;--bad-soft:#3a2216;--ok:#4ade80;--ok-soft:#13301f;--warn:#e6c34a;--warn-soft:#352d10;--hl:#5a4d10;--hl-on:#7a6812;--paper:#16171c;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent-2)}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:3px 9px;font-size:12px}
select,input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.muted{color:var(--muted)}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}

/* shell */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-.3px}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:-4px}
.company{margin-left:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px}
.top .sp{flex:1}
.bell{position:relative;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center}
.bell .cnt{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr)}
.side{position:sticky;top:56px;height:calc(100vh - 56px);border-right:1px solid var(--line);background:var(--card);padding:14px 10px;display:flex;flex-direction:column}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;margin-bottom:2px}
.side a:hover{background:var(--bg);color:var(--text)}
.side a.on{background:var(--soft);color:var(--accent);font-weight:700}
.side .n{margin-left:auto;font-size:11px;background:var(--bg);border-radius:99px;padding:0 7px;color:var(--muted)}
.side a.on .n{background:var(--card)}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.ic{width:18px;height:18px;flex:none}
main{padding:22px 24px 90px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}.side a{white-space:nowrap;margin:0 2px}.side .foot{display:none}main{padding:16px 16px 90px}.company,.me span{display:none}}

/* common */
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--soft);color:var(--accent)}.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;flex:none}
.av-kjw{background:#4f46e5}.av-psy{background:#db2777}.av-ldh{background:#0891b2}.av-cyn{background:#65a30d}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}

/* feed */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.tile b{display:block;font-size:24px;line-height:1.2;margin-top:2px}
.tile.on{border-color:var(--accent);outline:1px solid var(--accent)}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.ask{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.ask .q{flex:1;min-width:240px}
.ask .q b{color:var(--warn)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:1;min-width:180px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 140px;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row-title{font-weight:700;font-size:15px}
.row-meta{font-size:12px;color:var(--muted)}
.row-why{font-size:13px;margin-top:2px}
.row-side{text-align:right;font-size:12px}
.dl{font-size:16px;font-weight:800}
.dl.urgent{color:var(--bad)}
@media (max-width:700px){.row{grid-template-columns:1fr}.row-side{text-align:left}}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* detail */
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb a:hover{color:var(--accent)}
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.dhead h1{font-size:21px}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.kv b{color:var(--text);font-weight:600}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.bar.amend{background:var(--soft)}
.bar.alarm{background:var(--bad-soft);color:var(--bad);font-weight:600}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line)}
.banner.ok{background:var(--ok-soft)}.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}
.banner .big{font-size:20px;font-weight:800}
.banner.ok .big{color:var(--ok)}.banner.warn .big{color:var(--warn)}.banner.bad .big{color:var(--bad)}
.banner .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.diffbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:-4px 0 10px;font-size:13px}
.diffbox li{margin:2px 0}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}.viewer{position:static!important;height:auto!important;max-height:none!important}}
.cat{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.cat:first-child{margin-top:0}
.req{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;cursor:pointer}
.req:hover{border-color:var(--accent)}
.req.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.req-ic{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.req.MET .req-ic{background:var(--ok-soft);color:var(--ok)}.req.NOT_MET .req-ic{background:var(--bad-soft);color:var(--bad)}.req.UNKNOWN .req-ic{background:var(--warn-soft);color:var(--warn)}.req.NA .req-ic{background:var(--bg);color:var(--muted)}
.req-t{font-weight:700}
.req-r{font-size:13px;color:var(--muted)}
.req.NOT_MET .req-r{color:var(--bad)}.req.UNKNOWN .req-r{color:var(--warn)}
.req-ev{font-size:11px;color:var(--muted);margin-top:3px}
.req-ev b{color:var(--ok);font-weight:600}
.hard{font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.hard.y{border-color:var(--text);color:var(--text)}
.dropped{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.dropped summary{cursor:pointer;font-weight:600}
.dropped .x{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.viewer{position:sticky;top:72px;height:calc(100vh - 92px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.vhead{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);font-size:12px}
.vhead b{font-size:13px}
.page{background:var(--paper);margin:12px;border:1px solid var(--line);border-radius:4px;padding:18px 22px;font-size:13.5px;line-height:1.85}
.page .pno{font-size:11px;color:var(--muted);text-align:right;margin-bottom:4px}
.page p{margin:0 0 6px}
.page h4{margin:4px 0 10px;font-size:16px;text-align:center}
.page table{width:100%;border-collapse:collapse;font-size:13px}
.page td{border:1px solid var(--line);padding:5px 8px}
.page td:first-child{width:28%;background:var(--bg);font-weight:600}
.gap{text-align:center;color:var(--muted);font-size:11px}
mark.q{background:var(--hl);color:inherit;border-radius:3px;padding:1px 0;cursor:pointer}
mark.q.on{background:var(--hl-on);outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* board */
.bids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.bidc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.bidc:hover{border-color:var(--accent)}
.bidc .t{font-weight:700;margin:4px 0}
.prog{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}
.col.over{border-color:var(--accent);background:var(--soft)}
.col h3{display:flex;justify-content:space-between;font-size:13px;margin:2px 4px 10px}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.task[draggable=true]{cursor:grab}
.task .nt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .tt{font-weight:600;margin:2px 0 6px}
.task .ft{display:flex;align-items:center;gap:6px;font-size:12px}
.task .ft .sp{flex:1}
.task.over{border-color:var(--bad)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}

/* analyze */
.an{display:flex;gap:8px;flex-wrap:wrap}
.an input{flex:1;min-width:220px;font-size:15px;padding:9px 12px}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .s{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.steps li.done .s{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.steps li.run .s{background:var(--accent);color:#fff;border-color:var(--accent)}
.steps .d{font-size:12px;color:var(--muted)}
.console{margin-top:14px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:220px;overflow:auto;white-space:pre-wrap}

/* profile & report */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lic{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600;font-size:13px}
.lic button{border:0;background:transparent;padding:0 4px;color:inherit}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:800;line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.hb{display:grid;grid-template-columns:80px 1fr 48px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.hb .tr{height:8px;background:var(--bg);border-radius:99px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hb .base{background:var(--line)}.hb .now{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sample{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:14px}

/* overlays */
.drop{position:absolute;top:50px;right:60px;width:360px;max-height:440px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:30}
.drop .h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.drop .it{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.drop .it:hover{background:var(--bg)}
.drop .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.drop .it.read .dot{background:transparent}
@media (max-width:600px){.drop{right:8px;left:8px;width:auto}}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .f{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.radio{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast{background:#1f2030;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:100%}
.toast.err{background:var(--bad)}
.demo{position:fixed;right:16px;bottom:16px;z-index:40}
.demo>button{border-radius:99px;font-size:12px;background:#1f2030;color:#fff;border-color:#1f2030}
.demo .pn{position:absolute;bottom:42px;right:0;width:250px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.demo .pn button{width:100%;margin-bottom:6px;text-align:left}
.demo .pn .h{font-size:11px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<header class="top">
  <div class="logo">BidLens<small>공공 SW 입찰 판단</small></div>
  <div class="company">(주)오름테크 ▾</div>
  <div class="sp"></div>
  <button class="bell" data-ui="notif" aria-label="알림"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellCnt"></span></button>
  <div class="me"><span class="av av-kjw">지원</span><span>김지원 · 입찰 담당</span></div>
  <div id="notif"></div>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>
<div class="demo" id="demo"></div>

<script>
/* ===================== 판정 엔진 (화면과 무관한 순수 로직) ===================== */
const Engine = (() => {
  const BASE = new Date(2026, 9, 6), YEAR = 2026, W = '일월화수목금토';
  const at = d => { const x = new Date(BASE); x.setDate(x.getDate() + d); return x; };
  const fmt = d => { const x = at(d); return `${x.getMonth() + 1}/${x.getDate()}(${W[x.getDay()]})`; };
  const fmtLong = d => { const x = at(d); return `${x.getFullYear()}.${String(x.getMonth() + 1).padStart(2, '0')}.${String(x.getDate()).padStart(2, '0')}`; };
  const norm = s => s.replace(/\s+/g, '');
  const LABEL = { '가능': '참여 가능', '확인 필요': '확인 필요', '불가': '참여 불가' };
  const R = (id, cat, hard, subject, rule, page, quote) => ({ id, cat, hard, subject, rule, ev: { page, quote } });

  function judge(reqs) {
    const hard = reqs.filter(r => r.hard && r.status !== 'NA');
    const bad = hard.filter(r => r.status === 'NOT_MET'), unk = hard.filter(r => r.status === 'UNKNOWN');
    const counts = { total: hard.length, met: hard.length - bad.length - unk.length, unk: unk.length, bad: bad.length };
    if (bad.length) return { level: '불가', why: `${bad.map(r => r.subject).join(', ')} 미충족`, counts, bad, unk };
    if (unk.length) return { level: '확인 필요', why: `${unk.map(r => r.subject).join(', ')} 확인 필요`, counts, bad, unk };
    return { level: '가능', why: `필수 요건 ${hard.length}건 모두 충족`, counts, bad, unk };
  }

  function diffVersions(a, b) {
    const out = [];
    if (a.deadline !== b.deadline) out.push(`제안서 마감 ${fmt(a.deadline)} → ${fmt(b.deadline)}`);
    for (const r of a.reqs) if (!b.reqs.some(x => x.id === r.id)) out.push(`삭제 · ${r.subject}`);
    for (const r of b.reqs) {
      const old = a.reqs.find(x => x.id === r.id);
      if (!old) out.push(`추가 · ${r.subject}${r.hard ? ' (필수)' : ''}`);
      else if (r.rule.op === 'docs') { const add = r.rule.items.filter(i => !old.rule.items.includes(i)); if (add.length) out.push(`제출서류 추가 · ${add.join(', ')}`); }
    }
    return out;
  }

  function view(state, id) {
    const n = NOTICES[id], ns = state.notices[id], ver = n.versions[ns.v];
    const all = ver.reqs.map(r => {
      const page = ver.pages.find(p => p.page === r.ev.page);
      const verified = !!page && norm(page.text).includes(norm(r.ev.quote));
      return verified ? { ...r, verified, ...evaluate(r, state.profile) } : { ...r, verified, status: 'DROPPED' };
    });
    const reqs = all.filter(r => r.verified), dropped = all.filter(r => !r.verified);
    const verdict = judge(reqs), dLeft = ver.deadline - state.today, bid = state.bids[id] || null;
    let bidStatus = null;
    if (bid && bid.decision === '참여') bidStatus = dLeft < 0 ? '마감' : verdict.level === '불가' ? '재검토 필요' : '참여 준비 중';
    else if (bid) bidStatus = '불참';
    return { id, ...n, versions: undefined, v: ns.v, versionLabel: ver.label, versionNote: ver.note, hasNext: ns.v < n.versions.length - 1,
      deadline: ver.deadline, dLeft, closed: dLeft < 0, pages: ver.pages, reqs, dropped, verdict, bid, bidStatus,
      diff: ns.v > 0 ? diffVersions(n.versions[ns.v - 1], ver) : null,
      questions: reqs.filter(r => r.question).map(r => ({ ...r.question, reqId: r.id })) };
  }

  const visibleIds = s => IDS.filter(id => s.notices[id].visible);
  const docItems = v => v.reqs.filter(r => r.rule.op === 'docs').flatMap(r => r.rule.items);

  function previewTasks(state, nid) {
    const v = view(state, nid), out = [];
    v.verdict.unk.forEach(r => out.push({ key: `check:${r.id}`, kind: 'check', nid, reqId: r.id, title: `확인: ${r.subject}`,
      due: Math.max(state.today, Math.min(state.today + 2, v.deadline - 1)), owner: 'kjw', tight: false }));
    docItems(v).forEach(item => {
      let due = v.deadline - (LEAD[item] ?? 2); const tight = due < state.today; if (tight) due = state.today;
      out.push({ key: `doc:${item}`, kind: 'doc', nid, item, title: `${item} 준비`, due, owner: OWNER[item] || 'kjw', tight });
    });
    return out;
  }

  function taskViews(state) {
    return state.tasks.map(t => {
      const v = view(state, t.nid); let col = t.col;
      if (t.kind === 'check') { const r = v.reqs.find(x => x.id === t.reqId); col = !r || r.status !== 'UNKNOWN' ? 'done' : 'todo'; }
      return { ...t, col, auto: t.kind === 'check', done: col === 'done', overdue: col !== 'done' && t.due < state.today, notice: v };
    });
  }

  function openQuestions(state) {
    const map = {};
    for (const id of visibleIds(state)) for (const q of view(state, id).questions) (map[q.key] ??= { ...q, nids: [] }).nids.push(id);
    return Object.values(map);
  }

  function init() {
    const s = { today: 0, seq: 1,
      profile: { company: '(주)오름테크', bizNo: '000-00-00000', sme: true, region: '대전', licenses: [LIC],
        staff: [{ name: '김민수', role: 'PM', years: 12, certs: {} }, { name: '정하은', role: '개발 리드', years: 9, certs: { '정보처리기사': true } }, { name: '오세훈', role: '개발자', years: 5, certs: {} }],
        records: [
          { id: 'rec1', name: '△△구청 민원 접수 시스템 구축', org: '△△구청', year: 2024, amount: 3.2, topics: ['민원'], maybe: [] },
          { id: 'rec2', name: '□□공사 홈페이지 개편', org: '□□공사', year: 2023, amount: 1.1, topics: ['홈페이지'], maybe: ['민원'] },
          { id: 'rec3', name: '◇◇대학 학사 시스템 유지보수', org: '◇◇대학교', year: 2022, amount: 0.8, topics: ['교육'], maybe: ['민원'] },
          { id: 'rec4', name: '◎◎군 재난문자 연계 시스템 구축', org: '◎◎군청', year: 2025, amount: 2.4, topics: ['재난'], maybe: [] },
          { id: 'rec5', name: '□□교육지원청 학사 데이터 클라우드 이관', org: '□□교육지원청', year: 2024, amount: 1.9, topics: ['교육', '클라우드'], maybe: [] }],
        similar: {} },
      notices: Object.fromEntries(IDS.map(id => [id, { v: 0, visible: id !== 'G' }])),
      bids: { D: { decision: '참여', day: -2 } }, tasks: [], alerts: [], last: { ok: true } };
    const cols = { '제안서': 'doing', '실적증명서': 'doing', '인력 증빙': 'done', '발표 자료': 'todo' };
    previewTasks(s, 'D').forEach(t => s.tasks.push({ ...t, id: `t${s.seq++}`, col: cols[t.item] || 'todo' }));
    const n = visibleIds(s).length;
    s.alerts.push({ id: s.seq++, day: 0, kind: 'new', nid: null, read: false, text: `오늘 SW·정보화 용역 공고 ${n}건을 분석했습니다` });
    s.alerts.push({ id: s.seq++, day: -1, kind: 'task', nid: 'D', read: true, text: `${NOTICES.D.title}: 실적증명서 준비 기한 ${fmt(13)}` });
    return s;
  }

  function reduce(state, a) {
    const before = Object.fromEntries(visibleIds(state).map(id => [id, view(state, id).verdict.level]));
    const s = structuredClone(state); s.last = { ok: true };
    const alert = (kind, text, nid = null) => s.alerts.unshift({ id: s.seq++, day: s.today, kind, text, nid, read: false });
    const reject = msg => { s.last = { ok: false, msg }; };
    const pm = s.profile.staff[0];
    switch (a.type) {
      case 'answerPmCert': if (a.value === null) delete pm.certs[a.cert]; else pm.certs[a.cert] = a.value; break;
      case 'decideSimilar': { const k = `${a.recordId}:${a.topic}`; if (a.value === null) delete s.profile.similar[k]; else s.profile.similar[k] = a.value; break; }
      case 'addLicense': if (!a.value || s.profile.licenses.includes(a.value)) reject('이미 등록된 면허·인증입니다'); else s.profile.licenses.push(a.value); break;
      case 'removeLicense': s.profile.licenses = s.profile.licenses.filter(x => x !== a.value); break;
      case 'amend': {
        const n = NOTICES[a.nid], ns = s.notices[a.nid];
        if (ns.v >= n.versions.length - 1) { reject('더 받을 정정공고가 없습니다'); break; }
        const prev = n.versions[ns.v]; ns.v++;
        const cur = n.versions[ns.v], delta = cur.deadline - prev.deadline;
        alert('amend', `[${cur.label}] ${n.title}: ${cur.note}`, a.nid);
        if (s.bids[a.nid] && s.bids[a.nid].decision === '참여') {
          const mine = s.tasks.filter(t => t.nid === a.nid);
          if (delta) mine.forEach(t => { if (t.col !== 'done') t.due += delta; });
          const have = mine.filter(t => t.kind === 'doc').map(t => t.item);
          previewTasks(s, a.nid).filter(t => t.kind === 'doc' && !have.includes(t.item))
            .forEach(t => { s.tasks.push({ ...t, id: `t${s.seq++}`, col: 'todo' }); alert('task', `${n.title}: 할 일 추가 · ${t.title}`, a.nid); });
        }
        break;
      }
      case 'bid': {
        const v = view(s, a.nid);
        if (v.closed) { reject('마감이 지난 공고입니다'); break; }
        if (v.verdict.level === '불가') { reject(`참여 불가 판정입니다: ${v.verdict.why}`); break; }
        if (s.bids[a.nid] && s.bids[a.nid].decision === '참여') { reject('이미 참여로 결정한 공고입니다'); break; }
        s.bids[a.nid] = { decision: '참여', day: s.today };
        s.tasks = s.tasks.filter(t => t.nid !== a.nid);
        previewTasks(s, a.nid).forEach(t => s.tasks.push({ ...t, id: `t${s.seq++}`, owner: (a.owners && a.owners[t.key]) || t.owner, col: 'todo' }));
        break;
      }
      case 'noBid': s.bids[a.nid] = { decision: '불참', day: s.today, reason: a.reason }; s.tasks = s.tasks.filter(t => t.nid !== a.nid); break;
      case 'moveTask': {
        const t = s.tasks.find(x => x.id === a.id);
        if (!t) break;
        if (t.kind === 'check') { reject('확인 할 일은 회사 정보에 답하면 자동으로 완료됩니다'); break; }
        t.col = a.col; break;
      }
      case 'nextDay': {
        s.today++;
        for (const id of visibleIds(s)) {
          const b = s.bids[id]; if (!b || b.decision !== '참여') continue;
          const v = view(s, id), t = NOTICES[id].title;
          if ([7, 3, 1].includes(v.dLeft)) alert('deadline', `[마감 D-${v.dLeft}] ${t}`, id);
          if (v.dLeft === 0) alert('deadline', `[오늘 마감] ${t}`, id);
          if (v.dLeft === -1) alert('deadline', `[마감 지남] ${t}`, id);
        }
        taskViews(s).filter(t => !t.done && t.due === s.today - 1).forEach(t => alert('task', `[기한 지남] ${NOTICES[t.nid].title}: ${t.title}`, t.nid));
        break;
      }
      case 'analyze': s.notices.G.visible = true; alert('new', `분석 완료 · ${NOTICES.G.title}`, 'G'); break;
      case 'readAll': s.alerts.forEach(x => { x.read = true; }); break;
      case 'read': { const x = s.alerts.find(x => x.id === a.id); if (x) x.read = true; break; }
    }
    for (const id of visibleIds(s)) {
      const after = view(s, id).verdict.level;
      if (before[id] && before[id] !== after && s.bids[id] && s.bids[id].decision === '참여')
        alert('verdict', `${NOTICES[id].title}: 판정 ${LABEL[before[id]]} → ${LABEL[after]}${after === '불가' ? ' · 참여 재검토 필요' : ''}`, id);
    }
    return s;
  }

  return { init, reduce, view, visibleIds, taskViews, openQuestions, previewTasks, fmt, fmtLong, LABEL, PEOPLE, NOTICES };
})();
</script>

<script>
/* ===================== 화면 ===================== */
const E = Engine;
let S = E.init();
const ui = { filter: 'all', sort: 'verdict', q: '', activeReq: null, showDiff: false, notif: false, demo: false, modal: null, analyze: { status: 'idle', step: -1, logs: [], no: '' } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = o => esc(JSON.stringify(o));
const VC = { '가능': 'ok', '확인 필요': 'warn', '불가': 'bad' };
const ICON = { MET: '✓', NOT_MET: '✕', UNKNOWN: '?', NA: '·' };
const pill = l => `<span class="pill ${VC[l]}">${E.LABEL[l]}</span>`;
const dText = d => d < 0 ? '마감' : d === 0 ? '오늘 마감' : `D-${d}`;
const av = id => `<span class="av av-${id}" title="${E.PEOPLE[id]}">${E.PEOPLE[id].slice(1)}</span>`;
const bidPill = s => !s ? '' : s === '참여 준비 중' ? '<span class="pill info">참여 준비 중</span>' : s === '재검토 필요' ? '<span class="pill bad">재검토 필요</span>' : `<span class="pill gray">${s}</span>`;
const ICONS = {
  feed: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  board: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/>',
  analyze: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  profile: '<path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/>',
  report: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
};
const svg = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function dispatch(action, okMsg) {
  const before = Object.fromEntries(E.visibleIds(S).map(id => [id, E.view(S, id).verdict.level]));
  S = E.reduce(S, action);
  if (!S.last.ok) toast(S.last.msg, 'err');
  else {
    const ch = E.visibleIds(S).filter(id => before[id] && before[id] !== E.view(S, id).verdict.level);
    if (ch.length) {
      const first = E.view(S, ch[0]);
      toast(`판정을 다시 계산했습니다 · ${first.title}: ${E.LABEL[before[ch[0]]]} → ${E.LABEL[first.verdict.level]}${ch.length > 1 ? ` 외 ${ch.length - 1}건` : ''}`);
    }
    if (okMsg) toast(okMsg);
  }
  render();
}

function route() {
  const [, page, arg] = (location.hash || '#/feed').split('/');
  return { page: page || 'feed', arg };
}

/* ---------- 공통 영역 ---------- */
function renderChrome(r) {
  const bids = Object.values(S.bids).filter(b => b.decision === '참여').length;
  const nav = [['feed', '오늘의 공고', E.visibleIds(S).length], ['board', '입찰 보드', bids], ['analyze', '공고 분석', ''], ['profile', '회사 프로필', ''], ['report', '정확도 리포트', '']];
  $('#side').innerHTML = nav.map(([k, l, n]) => `<a href="#/${k}" class="${r.page === k || (k === 'feed' && r.page === 'notice') ? 'on' : ''}">${svg(k)}${l}${n !== '' ? `<span class="n">${n}</span>` : ''}</a>`).join('')
    + `<div class="foot">데이터: 조달청 나라장터 (공공데이터포털)<br>데모 · 공고·기관·회사는 가상입니다</div>`;
  const unread = S.alerts.filter(a => !a.read).length;
  $('#bellCnt').innerHTML = unread ? `<span class="cnt">${unread}</span>` : '';
  $('#notif').innerHTML = !ui.notif ? '' : `<div class="drop"><div class="h">알림 <button class="sm ghost" data-do="${J({ type: 'readAll' })}">모두 읽음</button></div>
    ${S.alerts.length ? S.alerts.map(a => `<div class="it ${a.read ? 'read' : ''}" data-ui="alert" data-arg="${a.id}"><span class="dot"></span><div>${esc(a.text)}<div class="muted" style="font-size:11px">${E.fmt(a.day)}</div></div></div>`).join('') : '<div class="empty">알림이 없습니다</div>'}</div>`;
  const A = E.view(S, 'A');
  $('#demo').innerHTML = `<button data-ui="demo">시연 도구 ${ui.demo ? '▾' : '▴'}</button>${ui.demo ? `<div class="pn"><div class="h">발표용 · 실제 서비스에는 없는 버튼입니다<br>오늘: ${E.fmt(S.today)}</div>
    <button data-do="${J({ type: 'amend', nid: 'A' })}" ${A.hasNext ? '' : 'disabled'}>공고 A ${A.hasNext ? (A.v === 0 ? '정정 1차' : '정정 2차') : '정정'} 도착시키기</button>
    <button data-do="${J({ type: 'nextDay' })}">하루 지나기</button>
    <button data-ui="reset">처음 상태로</button></div>` : ''}`;
}

/* ---------- 오늘의 공고 ---------- */
function questionBar(qs, scope) {
  if (!qs.length) return '';
  return qs.map(q => {
    const yes = q.kind === 'pmCert' ? { type: 'answerPmCert', cert: q.cert, value: true } : { type: 'decideSimilar', recordId: q.recordId, topic: q.topic, value: true };
    const no = { ...yes, value: false };
    const n = q.nids.length;
    return `<div class="ask"><div class="q"><b>확인이 필요한 회사 정보</b><br>${esc(q.text)}<div class="muted" style="font-size:12px">${scope === 'feed' ? `답하면 공고 ${n}건의 판정이 바로 다시 계산되고, 회사 프로필에 저장됩니다` : n > 1 ? `답하면 회사 프로필에 저장되어 다른 공고 ${n - 1}건에도 바로 반영됩니다` : '답하면 회사 프로필에 저장되어 다음 공고부터 다시 묻지 않습니다'}</div></div>
      <button class="primary" data-do="${J(yes)}">${q.kind === 'pmCert' ? '있음' : '유사사업 맞음'}</button><button data-do="${J(no)}">${q.kind === 'pmCert' ? '없음' : '유사사업 아님'}</button></div>`;
  }).join('');
}

function feedRows() {
  const order = { '가능': 0, '확인 필요': 1, '불가': 2 };
  let vs = E.visibleIds(S).map(id => E.view(S, id));
  if (ui.filter === '참여') vs = vs.filter(v => v.bid && v.bid.decision === '참여');
  else if (ui.filter !== 'all') vs = vs.filter(v => v.verdict.level === ui.filter);
  if (ui.q) vs = vs.filter(v => (v.title + v.org + v.no).includes(ui.q));
  vs.sort((a, b) => ui.sort === 'deadline' ? a.dLeft - b.dLeft : (order[a.verdict.level] - order[b.verdict.level]) || a.dLeft - b.dLeft);
  if (!vs.length) return '<div class="empty">조건에 맞는 공고가 없습니다</div>';
  return vs.map(v => {
    const why = v.verdict.level === '불가' ? `<span class="bad-t">✕ ${esc(v.verdict.bad.map(r => r.subject).join(', '))}</span>`
      : v.verdict.level === '확인 필요' ? `<span class="warn-t">? ${esc(v.verdict.unk.map(r => r.subject).join(', '))} 확인 필요</span>`
      : `<span class="ok-t">✓ 필수 요건 ${v.verdict.counts.total}건 모두 충족</span>`;
    return `<div class="row" data-nav="#/notice/${v.id}"><div>${pill(v.verdict.level)}</div>
      <div><div class="row-title">${esc(v.title)} ${v.v > 0 ? `<span class="chip warn">${v.versionLabel}</span>` : ''}</div>
        <div class="row-meta">${esc(v.org)} · 추정가격 ${v.budget} · ${v.method} · 공고 ${E.fmt(v.posted)}</div><div class="row-why">${why}</div></div>
      <div class="row-side"><div class="dl ${v.dLeft <= 3 ? 'urgent' : ''}">${dText(v.dLeft)}</div><div class="muted">${E.fmt(v.deadline)} 제안서 마감</div><div style="margin-top:4px">${bidPill(v.bidStatus)}</div></div></div>`;
  }).join('');
}

function renderFeed() {
  const vs = E.visibleIds(S).map(id => E.view(S, id));
  const c = l => vs.filter(v => v.verdict.level === l).length;
  const joined = vs.filter(v => v.bid && v.bid.decision === '참여').length;
  const tile = (f, label, n, cls = '') => `<button class="tile ${ui.filter === f ? 'on' : ''}" data-ui="filter" data-arg="${f}"><span class="muted">${label}</span><b class="${cls}">${n}</b></button>`;
  return `<div class="ph"><div><h1>오늘의 공고</h1><div class="sub">${E.fmtLong(S.today)} 기준 · 나라장터 전체 132건 중 SW·정보화 용역 ${vs.length}건 · (주)오름테크 프로필로 판정</div></div></div>

/* ---------- 공고 상세 ---------- */
function pageHtml(v, page) {
  const marks = v.reqs.filter(r => r.ev.page === page.page);
  const lines = page.text.split('\n').map(line => {
    const hits = marks.map(r => ({ r, i: line.indexOf(r.ev.quote) })).filter(h => h.i >= 0).sort((a, b) => a.i - b.i);
    let out = '', pos = 0;
    for (const { r, i } of hits) {
      if (i < pos) continue;
      out += esc(line.slice(pos, i)) + `<mark class="q ${ui.activeReq === r.id ? 'on' : ''}" id="q-${r.id}" data-ui="req" data-arg="${r.id}">${esc(r.ev.quote)}</mark>`;
      pos = i + r.ev.quote.length;
    }
    return `<p>${out + esc(line.slice(pos))}</p>`;
  });
  return `<div class="page"><div class="pno">- ${page.page} -</div>${lines.join('')}</div>`;
}

/* ---------- 공고 분석 ---------- */
const STEPS = [
  ['공고 정보 조회', '나라장터 입찰공고 API'], ['첨부파일 내려받기', '제안요청서, 공고문'], ['문서 파싱', 'HWPX·PDF → 쪽 단위 텍스트'],

];
function renderAnalyze() {
  const a = ui.analyze, done = S.notices.G.visible;
  const res = done ? E.view(S, 'G') : null;
  return `<div class="ph"><div><h1>공고 분석</h1><div class="sub">나라장터 공고번호를 넣으면 수집부터 판정까지 바로 진행합니다.</div></div></div>

      <button class="primary" data-ui="startAnalyze" ${a.status === 'running' ? 'disabled' : ''}>${a.status === 'running' ? '분석 중…' : '분석 시작'}</button></div>
      <ol class="steps">${STEPS.map(([t, d], i) => `<li class="${a.step > i || a.status === 'done' ? 'done' : a.step === i ? 'run' : ''}"><span class="s">${a.step > i || a.status === 'done' ? '✓' : i + 1}</span><div><b>${t}</b><div class="d">${d}</div></div></li>`).join('')}</ol>
      ${a.logs.length ? `<div class="console" id="console">${a.logs.map(esc).join('\n')}</div>` : ''}</div>
    ${res && a.status !== 'running' ? `<div class="banner ${VC[res.verdict.level]}" style="margin-top:14px"><div><div class="muted" style="font-size:12px">${res.no} · ${esc(res.org)}</div><div class="big">${esc(res.title)}</div>
      <div>${pill(res.verdict.level)} ${esc(res.verdict.why)}</div></div><div class="acts"><button class="primary" data-nav="#/notice/G">결과 보기</button></div></div>` : ''}`;
}
function startAnalyze() {
  const input = $('#anNo');
  ui.analyze.no = (input && input.value.trim()) || 'R26BK00414188';
  if (S.notices.G.visible) { ui.analyze.status = 'done'; ui.analyze.step = STEPS.length; toast('이미 분석한 공고입니다'); render(); return; }
  const g = E.NOTICES.G, logs = [
    [`> 공고 ${ui.analyze.no} 조회`, `  ${g.title} · ${g.org} · 용역 · 추정가격 ${g.budget}`],
    ['> 첨부 2개 내려받는 중', '  제안요청서.hwpx (1.8MB) · 공고문.pdf (0.4MB) · 해시 저장'],
    ['> 파싱', '  HWPX 38쪽 · PDF 6쪽 → 텍스트 44쪽, 표 5개'],
    ['> 요건 추출 (참가자격·인력·실적·제출서류 섹션만 전송)', '  요건 후보 7건 · 입력 9,812 토큰'],
    ['> 인용 검증', '  7건 중 6건 원문 일치 · 1건 제외 ("공동수급을 허용하지 아니한다" → p.2에 없음)'],
    ['> 판정', null],
  ];
  const run = {};
  Object.assign(ui.analyze, { status: 'running', step: 0, logs: [], run });
  const durs = [700, 800, 1300, 1700, 800, 700];
  let i = 0;
  const tick = () => {
    if (ui.analyze.run !== run) return; // 도중에 초기화하면 중단
    if (i < STEPS.length) {
      ui.analyze.step = i; ui.analyze.logs.push(logs[i][0]); render();
      setTimeout(() => {
        if (ui.analyze.run !== run) return;
        if (i === STEPS.length - 1) { S = E.reduce(S, { type: 'analyze' }); const v = E.view(S, 'G'); logs[i][1] = `  필수 요건 ${v.verdict.counts.total}건 · 충족 ${v.verdict.counts.met} · 확인 필요 ${v.verdict.counts.unk} · 미충족 ${v.verdict.counts.bad} → ${E.LABEL[v.verdict.level]}`; }
        ui.analyze.logs.push(logs[i][1]); i++; tick();
      }, durs[i]);
    } else { ui.analyze.status = 'done'; ui.analyze.logs.push('완료 · 총 6.0초'); toast('분석이 끝났습니다'); render(); }
  };
  tick();
}

  return `<div class="ph"><div><h1>정확도 리포트</h1><div class="sub">골든셋(사람이 라벨링한 RFP 30건)과 낙찰 결과로 시스템을 채점합니다.</div></div></div>
    <div class="sample">예시 값입니다. 실제 수치는 1주차 기준선 측정과 5주차 골든셋 30건 평가 후 채웁니다.</div>
    <div class="kpis">${kpi('92.4%', '필수 요건 추출 재현율')}${kpi('88.1%', '필수 요건 추출 정밀도')}${kpi('100%', '화면 표시 요건 인용 일치')}${kpi('6.3%', '인용 검증으로 제외된 요건 비율')}${kpi('3.8%', '낙찰자 오탈락률 (52건)')}${kpi('1분 12초', '공고 1건 평균 분석 시간')}</div>
    <div class="grid2"><div class="card"><h2>카테고리별 재현율</h2><div class="legend"><span><i style="background:var(--line)"></i>1주차 기준선</span><span><i style="background:var(--accent)"></i>현재</span></div>
      ${cats.map(([c, b, n]) => `<div class="hb"><span>${c}</span><div class="tr"><i class="base" style="width:${b}%"></i></div><span class="muted">${b}%</span></div><div class="hb"><span></span><div class="tr"><i class="now" style="width:${n}%"></i></div><span><b>${n}%</b></span></div>`).join('')}</div>
    <div class="card"><h2>인용 검증으로 제외한 요건</h2><div class="scroll"><table class="tbl"><tr><th>공고</th><th>AI가 추출한 요건</th><th>근거로 붙인 문장</th></tr>
      ${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="bad-t">${esc(r[1])}</td><td class="muted" style="font-size:12px">${esc(r[2])}</td></tr>`).join('')}</table></div>
      <div class="note">AI가 "가점"이나 "우대"를 "필수"로 잘못 읽은 경우가 대부분입니다. 근거 문장이 원문에 없으면 화면에 표시하지 않습니다.</div></div></div>`;
}

/* ---------- 모달 ---------- */
function renderModal() {
  const m = ui.modal;
  if (!m) return '';
  const v = E.view(S, m.nid);
  if (m.type === 'bid') {
    const ts = E.previewTasks(S, m.nid);
    return `<div class="modal-bg" data-ui="close"><div class="modal" data-stop><h2>참여 결정 · ${esc(v.title)}</h2>
      <div class="muted">제안서 마감 ${E.fmtLong(v.deadline)} (${dText(v.dLeft)})에서 거꾸로 계산해 할 일 ${ts.length}개를 만듭니다.</div>
      ${v.verdict.level === '확인 필요' ? `<div class="bar" style="background:var(--warn-soft);color:var(--warn);margin-top:10px">? 확인이 끝나지 않은 필수 요건 ${v.verdict.counts.unk}건이 있습니다. 확인 할 일이 함께 만들어지고, 답하면 자동으로 완료됩니다.</div>` : ''}
      <table class="tbl" style="margin-top:10px"><tr><th>할 일</th><th>기한</th><th>담당</th></tr>
      ${ts.map(t => `<tr><td>${t.kind === 'check' ? '<span class="chip warn">확인</span> ' : ''}${esc(t.title)}</td><td>${E.fmt(t.due)}${t.tight ? ' <span class="bad-t" style="font-size:11px">빠듯</span>' : ''}</td>
        <td><select data-change="owner" data-arg="${t.key}">${Object.entries(E.PEOPLE).map(([k, n]) => `<option value="${k}" ${(m.owners[t.key] || t.owner) === k ? 'selected' : ''}>${n}</option>`).join('')}</select></td></tr>`).join('')}</table>
      <div class="f"><button data-ui="close">취소</button><button class="primary" data-ui="bidConfirm">참여 확정</button></div></div></div>`;
  }
  const reasons = ['자격 요건 미충족', '수익성 낮음', '일정·인력 부족', '기타'];
  return `<div class="modal-bg" data-ui="close"><div class="modal" data-stop><h2>불참 · ${esc(v.title)}</h2><div class="muted" style="margin-bottom:10px">사유는 다음 공고 추천에 참고합니다.</div>
    ${reasons.map(r => `<label class="radio"><input type="radio" name="nb" value="${r}" ${m.reason === r ? 'checked' : ''} data-change="reason">${r}</label>`).join('')}
    <div class="f"><button data-ui="close">취소</button><button class="primary" data-ui="noBidConfirm">불참 확정</button></div></div></div>`;
}

/* ---------- 렌더와 이벤트 ---------- */
function render() {
  const r = route();
  renderChrome(r);
  const pages = { feed: renderFeed, notice: () => renderNotice(r.arg), board: renderBoard, analyze: renderAnalyze, profile: renderProfile, report: renderReport };
  $('#main').innerHTML = (pages[r.page] || renderFeed)();
  $('#modal').innerHTML = renderModal();
  const con = $('#console'); if (con) con.scrollTop = con.scrollHeight;
  if (r.page === 'notice' && ui.activeReq) {
    const mk = document.getElementById(`q-${ui.activeReq}`), vw = $('#viewer');
    if (mk && vw && getComputedStyle(vw).position === 'sticky') vw.scrollTop = mk.offsetTop - vw.clientHeight / 3;
  }
}

const UI = {
  filter: a => { ui.filter = ui.filter === a && a !== 'all' ? 'all' : a; render(); },
  req: a => { ui.activeReq = ui.activeReq === a ? null : a; render(); },
  diff: () => { ui.showDiff = !ui.showDiff; render(); },
  notif: () => { ui.notif = !ui.notif; render(); },
  demo: () => { ui.demo = !ui.demo; render(); },
  reset: () => { S = E.init(); Object.assign(ui, { modal: null, activeReq: null, analyze: { status: 'idle', step: -1, logs: [], no: '' } }); toast('처음 상태로 되돌렸습니다'); location.hash = '#/feed'; render(); },
  alert: a => { const al = S.alerts.find(x => x.id === +a); S = E.reduce(S, { type: 'read', id: +a }); ui.notif = false; if (al && al.nid) location.hash = `#/notice/${al.nid}`; render(); },
  bidOpen: a => { ui.modal = { type: 'bid', nid: a, owners: {} }; render(); },
  noBidOpen: a => { ui.modal = { type: 'nobid', nid: a, reason: '자격 요건 미충족' }; render(); },
  close: () => { ui.modal = null; render(); },
  bidConfirm: () => { const m = ui.modal; ui.modal = null; dispatch({ type: 'bid', nid: m.nid, owners: m.owners }, '참여를 결정했습니다 · 입찰 보드에 할 일이 생겼습니다'); },
  noBidConfirm: () => { const m = ui.modal; ui.modal = null; dispatch({ type: 'noBid', nid: m.nid, reason: m.reason }, '불참으로 기록했습니다'); },
  startAnalyze: () => startAnalyze(),
  addLic: () => dispatch({ type: 'addLicense', value: $('#licSel').value }, '면허·인증을 추가했습니다'),
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-do],[data-ui],[data-nav]');
  const box = e.target.closest('[data-stop]');
  if (box && (!t || !box.contains(t))) return; // 모달 안쪽 빈 곳 클릭은 무시
  if (ui.notif && !e.target.closest('.drop,.bell')) { ui.notif = false; if (!t) { render(); return; } }
  if (!t || t.disabled) return;
  if (t.dataset.do) dispatch(JSON.parse(t.dataset.do));
  else if (t.dataset.ui) UI[t.dataset.ui](t.dataset.arg);
  else if (t.dataset.nav) location.hash = t.dataset.nav;
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]'); if (!t) return;
  const k = t.dataset.change, val = t.value;
  if (k === 'sort') { ui.sort = val; render(); }
  else if (k === 'pmCert') dispatch({ type: 'answerPmCert', cert: '정보처리기사', value: val === '' ? null : val === 'true' });
  else if (k === 'similar') { const [recordId, topic] = t.dataset.arg.split(':'); dispatch({ type: 'decideSimilar', recordId, topic, value: val === '' ? null : val === 'true' }); }
  else if (k === 'owner') ui.modal.owners[t.dataset.arg] = val;
  else if (k === 'reason') ui.modal.reason = val;
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value.trim(); $('#feedList').innerHTML = feedRows(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); } });
document.addEventListener('dragstart', e => { const t = e.target.closest('[data-task]'); if (t) e.dataTransfer.setData('text/plain', t.dataset.task); });
document.addEventListener('dragover', e => { const c = e.target.closest('[data-col]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('[data-col]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest('[data-col]'); if (!c) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id) dispatch({ type: 'moveTask', id, col: c.dataset.col }); });
window.addEventListener('hashchange', () => { ui.activeReq = null; ui.showDiff = false; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
