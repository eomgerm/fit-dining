<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아마추어 대회 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 헤더(대회 찾기 · 내 대회 · 운영 · 심판) + 본문. 운영 현황은 왼쪽 코트판, 오른쪽 처리할 일·진행 기록. 심판 화면은 휴대폰 기준 한 열. 980px 아래 1열 */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --line:#DADDD3; --fg:#17201A; --muted:#5E665F;
  --accent:#1F6F46; --accent-weak:#E2EFE6; --accent-fg:#FFFFFF;
  --ok:#1F7A4C; --ok-weak:#E1F1E7; --warn:#A5680F; --warn-weak:#FAEFD8; --bad:#BC3F37; --bad-weak:#F8E4E2; --info:#2C67A8;
  --sp-futsal:#2E7D4F; --sp-bball:#C4602A; --sp-badminton:#2F6E9E; --sp-esports:#5A4BB0;
  --shadow:0 8px 30px rgba(20,30,20,.12);
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A1F1B; --line:#2A312C; --fg:#E6EAE5; --muted:#9AA39C;
  --accent:#6CC596; --accent-weak:#1C3326; --accent-fg:#0E1A13;
  --ok:#5BC48C; --ok-weak:#16301F; --warn:#E3AC4F; --warn-weak:#33291A; --bad:#EE7C73; --bad-weak:#3A1F1E; --info:#7EB0EA;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A1F1B; --line:#2A312C; --fg:#E6EAE5; --muted:#9AA39C;
  --accent:#6CC596; --accent-weak:#1C3326; --accent-fg:#0E1A13;
  --ok:#5BC48C; --ok-weak:#16301F; --warn:#E3AC4F; --warn-weak:#33291A; --bad:#EE7C73; --bad-weak:#3A1F1E; --info:#7EB0EA;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.app{min-height:100%;display:flex;flex-direction:column}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-mut{color:var(--muted)} .st-info{color:var(--info)}
.state{font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;vertical-align:middle;margin-right:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:5px;vertical-align:middle}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.01em}
nav.nav{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden}
nav.nav button{background:none;border:0;padding:18px 11px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav.nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.clk{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:820px){nav.nav{order:3;width:100%;margin-top:-6px}nav.nav button{padding:10px 11px}.top-in{padding-top:10px}}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 16px 32px;box-sizing:border-box}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .sp{margin-left:auto;font-weight:400}
.panel h3,.myhero h3{font-size:14px;margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15}
.pagehead .acts{margin-left:auto}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;margin-bottom:10px}
.sec{font-size:16px;margin:26px 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:5px 7px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.wide{width:100%}
.btn.big{min-height:52px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],select.in,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:80px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .sp{flex:1}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* 종목 띠 */
.strip{position:relative;height:84px;overflow:hidden;display:flex;align-items:flex-end;padding:10px 14px;box-sizing:border-box;color:#fff}
.strip svg.lines{position:absolute;inset:6px 10px;width:calc(100% - 20px);height:calc(100% - 12px)}
.strip .kick{position:relative;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.sp-futsal{background-color:var(--sp-futsal);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 22px,transparent 22px 44px)}
.sp-bball{background-color:var(--sp-bball);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 6px,transparent 6px 12px)}
.sp-badminton{background-color:var(--sp-badminton)}
.sp-esports{background-color:var(--sp-esports);background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:12px 12px}
.strip.big{height:126px;border-radius:14px;padding:16px 20px}
.strip.big .ttl{position:relative;display:flex;flex-direction:column;gap:4px}
.strip.big h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.2)}
@media (max-width:560px){.strip.big h1{font-size:22px}}

/* 대회 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tcard{text-align:left;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tcard:hover{border-color:var(--muted)}
.tcard .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tcard .nm{font-weight:700;font-size:15.5px;line-height:1.35}
.tcard .ln{font-size:12.5px;color:var(--muted)}
.tcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;font-size:13px;flex-wrap:wrap}
.tcard .fee{margin-left:auto;font-weight:600}
.cap{height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.cap i{display:block;height:100%;background:var(--accent)}

/* 탭 · 단계 · 요약 숫자 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden}
.tabs button{background:none;border:0;padding:9px 13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:11px;color:var(--bad);margin-left:3px}
.phase{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin:14px 0 4px}
.phase span.on{color:var(--fg);font-weight:700;border-bottom:2px solid var(--accent)}
.phase i{font-style:normal;opacity:.5}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin:12px 0 16px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
.stats b small{font-size:15px;color:var(--muted)}
.stats span{font-size:12px;color:var(--muted)}

/* 운영 현황 · 코트판 */
.cgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.courts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.courts{grid-template-columns:minmax(0,1fr)}}
.court{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.court.live{border-color:var(--bad)}
.court .ch{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.court .ch b{font-family:var(--f-display);font-weight:400;font-size:18px}
.court .ch .sp{margin-left:auto}
.court .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.sb .tm{font-weight:700;overflow-wrap:anywhere;font-size:13.5px}
.sb .sc{font-family:var(--f-display);font-size:40px;line-height:1}
.sb .vs{color:var(--muted);font-family:var(--f-mono)}
.sb.sm .sc{font-size:30px}
.tline{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tmr{font-family:var(--f-mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.nextrow{border-top:1px dashed var(--line);padding-top:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.todo .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:13px}
.todo .it:first-child{border-top:0;padding-top:0}
.todo .w{font-size:11.5px;font-weight:700}
.feed{display:flex;flex-direction:column;max-height:380px;overflow-y:auto}
.feed .it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.feed .it:first-child{border-top:0}
.feed .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.lr{display:grid;grid-template-columns:46px 18px 92px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.lrows .lr:first-child{border-top:0;padding-top:0}
@media (max-width:520px){.lr{grid-template-columns:46px 18px minmax(0,1fr) auto}.lr .stg{display:none}}

/* 표 */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t th{color:var(--muted);font-size:12px;font-weight:600}
table.t .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.t tr.live td{background:var(--bad-weak)}
table.t tr.mine td{background:var(--accent-weak)}
table.sch{min-width:720px}
table.std{min-width:400px}
table.std th,table.std td{padding:8px 6px}

/* 본선 대진 */
.bwrap{overflow-x:auto;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:26px;min-width:600px}
.round{display:flex;flex-direction:column}
.round .rh{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.round .ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:14px}
.mt{border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;position:relative}
.round:not(:last-child) .mt::after{content:"";position:absolute;right:-27px;top:50%;width:26px;border-top:1.5px solid var(--line)}
.mt .row{display:flex;justify-content:space-between;gap:8px;padding:6px 10px}
.mt .row+.row{border-top:1px solid var(--line)}
.mt .row .s{font-family:var(--f-mono);font-weight:600}
.mt .row.win{font-weight:700}
.mt .row.lose,.mt .row.tbd{color:var(--muted)}
.mt.live{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.mt .meta{font-size:11px;color:var(--muted);padding:0 10px 6px;font-family:var(--f-mono)}
.champ{border:1.5px solid var(--fg);border-radius:10px;padding:14px;text-align:center;background:var(--surface)}
.champ svg{width:34px;height:34px;display:block;margin:0 auto 4px}
.champ .t{font-family:var(--f-display);font-size:22px;line-height:1.2}
.champ .rk{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.champ .rk b{color:var(--fg)}

/* 심판 화면 */
.ref{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.rcard.live{border-color:var(--bad)}
.rtimer{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.rtimer .tmr{font-size:28px}
.rteams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.rt{display:flex;flex-direction:column;gap:8px;text-align:center;min-width:0}
.rt b{font-size:15px;overflow-wrap:anywhere;min-height:2.8em;display:flex;align-items:center;justify-content:center}
.rsc{font-family:var(--f-display);font-size:72px;line-height:1}
.rplus{min-height:56px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px}
.rmini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rmini button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px}
.rplus:disabled,.rmini button:disabled{opacity:.45;cursor:not-allowed}
.rvs{font-family:var(--f-display);font-size:40px;color:var(--muted);padding-top:52px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.big2{font-family:var(--f-display);font-size:34px;line-height:1.1}
.evs{display:flex;flex-direction:column;gap:3px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
.banner{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* 참가팀 화면 */
.myhero{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.myhero .strip{height:64px}
.myhero>.bd{padding:16px;display:flex;flex-direction:column;gap:16px}
.tmhead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tmhead .btn{margin-left:auto}
.tname{font-family:var(--f-display);font-size:30px;line-height:1.1}
.nextcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.nextcard.call{border-color:var(--warn);background:var(--warn-weak)}
.nextcard.live{border-color:var(--bad)}
.nextcard .big{font-family:var(--f-display);font-size:30px;line-height:1.1}
.nextcard .sb{width:100%}
.mgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.entries{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.entry .em{display:flex;flex-direction:column;gap:4px;min-width:0}
.entry .es{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:560px){.entry{grid-template-columns:minmax(0,1fr)}.entry .es{align-items:flex-start}}
.pay{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0}
.pay dt{color:var(--muted)} .pay dd{margin:0}

/* 대회 페이지(접수) · 운영 목록 · 편성 */
.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}.dgrid .side{order:-1}}
.cta .gap{display:flex;flex-direction:column;gap:12px}
.stline{font-size:16px;font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.prose p{margin:0 0 10px;max-width:62ch}
.prose ul{margin:0 0 10px;padding-left:18px}
.prose h3{font-size:14px;margin:16px 0 6px}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.teamlist div{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.notice{padding:12px 0;border-top:1px solid var(--line)}
.notice:first-child{border-top:0;padding-top:0}
.notice .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.notice p{margin:4px 0 0;white-space:pre-wrap}
.nform{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.nform .field{width:180px}
.hostlist{display:flex;flex-direction:column;gap:12px}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);align-items:center}
.hrow .strip{height:100%;min-height:96px}
.hrow .bd{padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}

  F.M.filter(m=>m.stage===k+'조'&&m.st==='done').forEach(m=>{const A=R[m.a],B=R[m.b];if(!A||!B)return;A.p++;B.p++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;A.pts+=3}else if(m.sa<m.sb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}});
  const h2h=(x,y)=>{const m=F.M.find(m=>m.stage===k+'조'&&m.st==='done'&&((m.a===x&&m.b===y)||(m.a===y&&m.b===x)));if(!m)return 0;return m.a===x?m.sb-m.sa:m.sa-m.sb};
  return Object.values(R).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||h2h(x.id,y.id)||tn(x.id).localeCompare(tn(y.id),'ko'));
}
const groupDone=k=>F.M.some(m=>m.stage===k+'조')&&F.M.filter(m=>m.stage===k+'조').every(m=>m.st==='done');
function winner(m){if(m.ff!=null)return m.ff===0?m.b:m.a;if(m.sa!==m.sb)return m.sa>m.sb?m.a:m.b;return (m.pa??0)>(m.pb??0)?m.a:m.b}
const loser=m=>winner(m)===m.a?m.b:m.a;
const involves=(m,id)=>m.a===id||m.b===id;
const opp=m=>m.a===MY?m.b:m.a;
const myMatches=()=>F.M.filter(m=>involves(m,MY)).sort(byTime);
const courtBusy=c=>F.M.some(m=>m.court===c&&m.st==='live');
const pair=m=>m.a?`${tn(m.a)} vs ${tn(m.b)}`:`${m.ph[0]} vs ${m.ph[1]}`;
function stageText(){if(F.phase==='setup')return '편성';if(F.phase==='done')return '종료';return groupDone('A')&&groupDone('B')?'본선':'조별 리그'}
function stageLabel(m){return m.ko?(m.stage==='4강'?`4강 ${m.no}경기`:m.stage):`${m.stage} ${m.rd}라운드`}
function clockText(m){const h=CFG.dur*30,e=Math.min(m.el,CFG.dur*60);return (e<h?'전반 ':'후반 ')+mmss(e<h?e:e-h)}
const clockShort=m=>clockText(m).replace('전반 ','전 ').replace('후반 ','후 ');

// 조별 리그가 모두 확정되면 4강을, 4강이 끝나면 결승·3·4위전을 채운다. 아직 시작 전인 경기만 다시 계산한다.
function progress(){
  const [s1,s2,p3,fn]=['sf1','sf2','p3','fin'].map(byId);if(!s1)return;
  if(groupDone('A')&&groupDone('B')){
    const A=standings('A'),B=standings('B');
    if(s1.st==='sched'){s1.a=A[0].id;s1.b=B[1].id}
    if(s2.st==='sched'){s2.a=B[0].id;s2.b=A[1].id}
    if(!F.koAnn){F.koAnn=1;log(`조별 리그 종료 · 4강 대진 확정: ${pair(s1)}, ${pair(s2)}`,{k:'info'});
      const mine=[s1,s2].find(m=>involves(m,MY));notifyMe(mine?`4강 진출 · ${hm(mine.sch+mine.shift)} ${mine.court}코트 vs ${tn(opp(mine))}`:'조별 리그가 끝났어요. 4강에는 오르지 못했어요')}
  } else if(s1.st==='sched'&&s2.st==='sched'){s1.a=s1.b=s2.a=s2.b=null;F.koAnn=0}
  const done=m=>m.st==='done';
  if(fn.st==='sched'){fn.a=done(s1)?winner(s1):null;fn.b=done(s2)?winner(s2):null}
  if(p3.st==='sched'){p3.a=done(s1)?loser(s1):null;p3.b=done(s2)?loser(s2):null}
  if(done(fn)&&done(p3)&&F.phase!=='done'){F.phase='done';log(`대회 종료 · 우승 ${tn(winner(fn))}, 준우승 ${tn(loser(fn))}, 3위 ${tn(winner(p3))}`,{k:'info'})}
}

/* ---------- 기록 · 알림 ---------- */
function log(x,o={}){F.feed.unshift({t:now(),x,...o});F.feed.length=Math.min(F.feed.length,80);S.dirty=true}
function notifyMe(x){S.myNotes.unshift({t:now(),x});S.unread++;S.dirty=true;toast('코딩FC 알림 · '+x)}

/* ---------- 경기 진행 ---------- */
function callMatch(m){if(m.st!=='sched'||!m.a||!m.b)return;m.st='called';m.calledAt=now();
  log(`${m.court}코트 호출: ${pair(m)} (${hm(m.sch+m.shift)})`,{c:m.court});
  if(involves(m,MY))notifyMe(`다음 경기 호출 · ${m.court}코트로 와 주세요 (vs ${tn(opp(m))})`)}
function arrive(m,i){if(m.rdy[i])return;m.rdy[i]=true;log(`${tn(i?m.b:m.a)} ${m.court}코트 도착`,{c:m.court})}
function startMatch(m){m.st='live';m.run=true;m.el=0;m.timeup=false;m.startAt=now();m.rdy=[true,true];
  log(`${m.court}코트 경기 시작: ${pair(m)}`,{c:m.court});if(involves(m,MY))notifyMe(`경기 시작 · vs ${tn(opp(m))}`)}
function goal(m,i,d){
  const k=i?'sb':'sa';
  if(d>0){m[k]++;m.ev.unshift({t:clockShort(m),s:i,k:'goal'});log(`${m.court}코트 득점: ${tn(i?m.b:m.a)} (${m.sa}:${m.sb})`,{c:m.court})}
  else{if(!m[k])return;m[k]--;const j=m.ev.findIndex(e=>e.k==='goal'&&e.s===i);if(j>=0)m.ev.splice(j,1);log(`${m.court}코트 득점 취소: ${tn(i?m.b:m.a)} (${m.sa}:${m.sb})`,{c:m.court})}
}
function foul(m,i){const h=m.el<CFG.dur*30?0:1;m.fo[h][i]++;m.ev.unshift({t:clockShort(m),s:i,k:'foul'});S.dirty=true}
function submit(m){m.run=false;m.st='review';m.subAt=now();m.ok=[false,false];m.okAt=null;
  const pk=m.pa!=null?` (승부차기 ${m.pa}:${m.pb})`:'';
  log(`${m.court}코트 결과 제출: ${tn(m.a)} ${m.sa}:${m.sb} ${tn(m.b)}${pk}`,{c:m.court});
  if(involves(m,MY))notifyMe(`결과 제출 ${m.sa}:${m.sb} · 10분 안에 확인하거나 이의를 제기할 수 있어요`)}
function confirmM(m,how){m.st='done';m.doneAt=now();log(`결과 확정 (${how}): ${tn(m.a)} ${m.sa}:${m.sb} ${tn(m.b)}`,{});
  if(involves(m,MY))notifyMe(`결과 확정 ${m.sa}:${m.sb} (${how})`);progress()}
function forfeit(m,i,why){m.ff=i;m.run=false;if(i===0){m.sa=0;m.sb=3}else{m.sa=3;m.sb=0}m.pa=m.pb=null;m.st='done';m.doneAt=now();
  log(`${tn(i?m.b:m.a)} 기권 (${why}) · ${tn(i?m.a:m.b)} 3:0 승`,{c:m.court});if(involves(m,MY))notifyMe(`기권 처리 · ${tn(i?m.b:m.a)} (${why})`);progress()}
function pushDelay(c,min){const ms=F.M.filter(m=>m.court===c&&(m.st==='sched'||m.st==='called'));ms.forEach(m=>m.shift+=min);
  log(`${c}코트 남은 ${ms.length}경기 ${min}분 미룸 · 해당 팀에 알림`,{c});
  if(ms.some(m=>involves(m,MY)))notifyMe(`경기 시간 변경 · ${c}코트 경기가 ${min}분 늦춰졌어요`)}
function moveMatch(m,c,t){const old=`${m.court}코트 ${hm(m.sch+m.shift)}`;m.court=c;m.shift=t-m.sch;
  log(`일정 변경: ${pair(m)} ${old} → ${c}코트 ${hm(t)}`,{c});if(involves(m,MY))notifyMe(`경기 일정 변경 · ${c}코트 ${hm(t)}`)}
function editResult(m,sa,sb,pa,pb,why){m.hist.push({t:now(),from:`${m.sa}:${m.sb}`,to:`${sa}:${sb}`,why});
  Object.assign(m,{sa,sb,pa,pb,ff:null,st:'done',doneAt:now()});
  log(`결과 수정: ${tn(m.a)} ${sa}:${sb} ${tn(m.b)} (${why})`,{});if(involves(m,MY))notifyMe(`결과 수정 ${sa}:${sb} · ${why}`);progress()}
function dispute(m,why){m.st='dispute';m.disp=why;log(`이의 제기 (${tn(MY)}): ${pair(m)} · ${why}`,{c:m.court})}
// 다음 단계 경기가 시작되기 전까지만 결과를 고칠 수 있다
function editable(m){if(m.ko)return m.id.startsWith('sf')?['p3','fin'].every(id=>byId(id).st==='sched'):true;return ['sf1','sf2'].every(id=>byId(id).st==='sched')}
// 코트별 예상 시작 시각: 앞 경기가 늦게 끝나면 뒤 경기가 밀린다
function expected(c){
  const ms=F.M.filter(m=>m.court===c&&m.st!=='done').sort(byTime);let free=now();const E={};
  for(const m of ms){
    if(m.st==='live'){E[m.id]=m.startAt;free=now()+Math.max(0,CFG.dur*60-m.el)/60+CFG.gap;continue}
    if(m.st==='review'||m.st==='dispute'){E[m.id]=m.startAt??m.sch;continue}
    const s=Math.max(m.sch+m.shift,free);E[m.id]=s;free=s+CFG.dur+CFG.gap}
  return E}
function courtDelay(c){const E=expected(c);const m=F.M.filter(m=>m.court===c&&(m.st==='sched'||m.st==='called')).sort(byTime)[0];return m?Math.max(0,Math.round(E[m.id]-(m.sch+m.shift))):0}
function isNextOnCourt(m){return F.M.filter(x=>x.court===m.court&&(x.st==='sched'||x.st==='called')).sort(byTime)[0]===m}

/* ---------- 데모 시계 ---------- */
// 자동 진행 코트는 다른 심판이 입력하는 것처럼 호출·득점·결과 제출을 한다
function autoCourt(c){
  const q=F.M.filter(m=>m.court===c&&m.st!=='done').sort(byTime);
  const live=q.find(m=>m.st==='live'),nx=q.find(m=>(m.st==='sched'||m.st==='called')&&m.a&&m.b);
  if(nx&&nx.st==='sched'&&now()>=nx.sch+nx.shift-10&&isNextOnCourt(nx))callMatch(nx);
  if(live){const f=CLK.speed/5;
    if(live.run){if(Math.random()<.011*f)goal(live,0,1);if(Math.random()<.011*f)goal(live,1,1);if(Math.random()<.012*f)foul(live,Math.random()<.5?0:1)}
    if(live.el>=CFG.dur*60){if(live.ko&&live.sa===live.sb){live.pa=3+Math.floor(Math.random()*2);live.pb=live.pa+(Math.random()<.5?1:-1)}submit(live)}
    return}
  if(nx&&nx.st==='called'&&nx.rdy[0]&&nx.rdy[1]&&now()>=nx.sch+nx.shift-2)startMatch(nx);
}
function tick(){
  const d=CLK.speed;if(!d)return;const pm=Math.floor(now());CLK.s+=d;
  if(F.phase==='setup'&&Math.random()<.12*d/5){const left=TEAMS.filter(t=>!F.checkin[t.id]&&t.id!==MY);if(left.length){const t=left[Math.floor(Math.random()*left.length)];F.checkin[t.id]=hm(now());log(`${t.n} 체크인`)}}
  if(F.phase==='live'){
    F.M.forEach(m=>{
      if(m.st==='live'&&m.run){m.el=Math.min(CFG.dur*60,m.el+d);if(m.el>=CFG.dur*60){m.run=false;m.timeup=true;if(!F.auto[m.court])log(`${m.court}코트 경기 시간 종료 · 결과 제출 대기`,{c:m.court})}}
      if(m.st==='called'){
        if(!m.rdyAt)m.rdyAt=[m.a,m.b].map(id=>m.calledAt+(id==='hf'&&!F.hfLate?(F.hfLate=1,14):rnd(1,3)));
        [0,1].forEach(i=>{const id=i?m.b:m.a;if(!m.rdy[i]&&now()>=m.rdyAt[i]&&(id!==MY||F.auto[m.court]))arrive(m,i)})}
      if(m.st==='review'){
        if(!m.okAt)m.okAt=[0,1].map(()=>m.subAt+rnd(1,3));
        [0,1].forEach(i=>{const id=i?m.b:m.a;if(!m.ok[i]&&now()>=m.okAt[i]&&(id!==MY||F.auto[m.court])){m.ok[i]=true;S.dirty=true}});
        if(m.ok[0]&&m.ok[1])confirmM(m,'양 팀 확인');else if(now()>=m.subAt+10)confirmM(m,'10분 경과')}});
    ['A','B'].forEach(c=>{if(F.auto[c])autoCourt(c)})}
  if(Math.floor(now())!==pm)S.dirty=true;
}

/* ---------- 편성 ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawGroups(seeded){
  if(seeded){const rest=shuffle(TEAMS.map(t=>t.id).filter(x=>x!=='pm'&&x!=='bs'));F.groups={A:['pm',...rest.slice(0,3)],B:['bs',...rest.slice(3)]}}
  else{const s=shuffle(TEAMS.map(t=>t.id));F.groups={A:s.slice(0,4),B:s.slice(4)}}
}
function resetSetup(){
  Object.assign(F,{phase:'setup',M:[],koAnn:0,hfLate:0,seeded:true,auto:{A:false,B:true},refs:{A:'나',B:'박심판'},checkin:{bs:'12:38',pm:'12:39',np:'12:40'},feed:[{t:toM('12:40'),x:'체크인 시작'}]});
  CLK.s=toM('12:40')*60;drawGroups(true);S.ctab='teams';S.myNotes=[];S.unread=0;
}
function startLive(start){
  F.M=buildMatches(F.groups,start);Object.assign(F,{phase:'live',koAnn:0,hfLate:0});if(CLK.s<(start-3)*60)CLK.s=(start-3)*60;
  log(`대진·일정 공개 · 첫 경기 ${hm(start)}`,{});const f=myMatches()[0];notifyMe(`대진 공개 · 첫 경기 ${hm(f.sch)} ${f.court}코트 vs ${tn(opp(f))}`);S.ctab='now';
}

/* ---------- 공통 조각 ---------- */
const nm=(m,i)=>{const id=i?m.b:m.a;return id?esc(tn(id)):`<span class="muted">${esc(m.ph[i])}</span>`};
function scoreLine(m,sm){return `<div class="sb ${sm?'sm':''}"><span class="tm">${nm(m,0)}</span><span class="sc">${m.sa}</span><span class="vs">:</span><span class="sc">${m.sb}</span><span class="tm">${nm(m,1)}</span></div>${m.pa!=null?`<div class="tline">승부차기 ${m.pa}:${m.pb}</div>`:''}`}

// 코트판: 진행 중(또는 확인 대기) 경기 + 다음 경기
function courtCard(c,host){
  const q=F.M.filter(m=>m.court===c&&m.st!=='done').sort(byTime);
  const cur=q.find(m=>m.st==='live')||q.find(m=>m.st==='review'||m.st==='dispute');
  const nx=q.find(m=>m!==cur&&(m.st==='sched'||m.st==='called'));
  const dl=courtDelay(c);let body='';
  if(cur){
    const live=cur.st==='live';
    const stx=live?(cur.run?'<span class="live-dot"></span>진행 중':cur.timeup?'<span class="st-warn state">경기 시간 종료</span>':'일시 정지')
      :cur.st==='dispute'?'<span class="st-bad state">이의 제기</span>':`확인 대기 · 양 팀 ${cur.ok.filter(Boolean).length}/2`;
    const act=!host?'':live?`<button class="btn sm" data-action="toRef" data-c="${c}">점수 입력 화면</button><button class="btn sm ${cur.timeup?'pri':''}" data-action="end" data-id="${cur.id}">경기 종료</button>`
      :cur.st==='dispute'?`<button class="btn sm pri" data-action="resolve" data-id="${cur.id}">이의 처리</button>`
      :`<button class="btn sm pri" data-action="confirm" data-id="${cur.id}">결과 확정</button><button class="btn sm" data-action="edit" data-id="${cur.id}">수정</button>`;
    body+=`<div class="small muted">${stageLabel(cur)} · ${hm(cur.sch+cur.shift)} 경기</div>${scoreLine(cur)}
      <div class="tline">${stx}${live?` · <span class="tmr" data-timer="${cur.id}">${clockText(cur)}</span>`:''}</div>${act?`<div class="acts">${act}</div>`:''}`;
  } else body+=`<div class="small muted">${q.length?'진행 중인 경기 없음':'이 코트 경기가 모두 끝났어요'}</div>`;
  if(nx){
    const t=nx.sch+nx.shift,e=expected(c)[nx.id];
    const rd=[0,1].map(i=>`<span class="${nx.rdy[i]?'st-ok':'muted'}">${esc(tn(i?nx.b:nx.a))} ${nx.rdy[i]?'도착':'대기'}</span>`).join(' · ');
    let act='';
    if(host&&nx.a&&nx.b){
      if(nx.st==='sched')act=`<button class="btn sm" data-action="call" data-id="${nx.id}">호출</button>`;
      else act=[0,1].filter(i=>!nx.rdy[i]).map(i=>`<button class="btn sm" data-action="arrive" data-id="${nx.id}" data-i="${i}">${esc(tn(i?nx.b:nx.a))} 도착 확인</button>`).join('')
        +`<button class="btn sm pri" data-action="start" data-id="${nx.id}" ${nx.rdy[0]&&nx.rdy[1]&&!courtBusy(c)?'':'disabled'}>경기 시작</button>`;
      act+=`<button class="btn sm ghost" data-action="move" data-id="${nx.id}">시간·코트</button>`}
    body+=`<div class="nextrow"><div><span class="muted">다음</span> <b class="mono">${hm(t)}</b>${e-t>=3?` <span class="st-warn small">예상 ${hm(e)}</span>`:''} · ${stageLabel(nx)} · ${nm(nx,0)} vs ${nm(nx,1)}</div>
      ${nx.st==='called'?`<div class="small"><span class="state st-warn">호출됨</span> ${hm(nx.calledAt)} · ${rd}</div>`:''}${act?`<div class="acts">${act}</div>`:''}</div>`;
  }
  return `<section class="court ${cur&&cur.st==='live'?'live':''}"><div class="ch"><b>${c}코트</b><span class="small muted">심판 ${esc(F.refs[c])}${F.auto[c]?' · 자동 진행':''}</span><span class="sp small ${dl>=3?'st-warn state':'muted'}">${dl>=3?`${dl}분 지연`:'정시'}</span></div><div class="bd">${body}</div></section>`;
}

// 운영본부가 지금 처리해야 할 일
function todos(){
  const L=[],t=now();
  F.M.forEach(m=>{
    if(m.st==='dispute')L.push({w:'이의 제기',c:'st-bad',x:`${stageLabel(m)} ${tn(m.a)} ${m.sa}:${m.sb} ${tn(m.b)} · ${m.disp}`,b:`<button class="btn sm pri" data-action="resolve" data-id="${m.id}">처리</button>`});
    if(m.st==='review')L.push({w:'결과 확인',c:'st-info',x:`${m.court}코트 ${tn(m.a)} ${m.sa}:${m.sb} ${tn(m.b)} · 양 팀 확인 ${m.ok.filter(Boolean).length}/2 · ${Math.max(0,Math.ceil(m.subAt+10-t))}분 뒤 자동 확정`,b:`<button class="btn sm pri" data-action="confirm" data-id="${m.id}">확정</button>`});
    if(m.st==='live'&&m.timeup)L.push({w:'결과 제출',c:'st-warn',x:`${m.court}코트 경기 시간 종료 · ${tn(m.a)} ${m.sa}:${m.sb} ${tn(m.b)}`,b:`<button class="btn sm pri" data-action="end" data-id="${m.id}">경기 종료</button>`});
    if(m.st==='called'){
      [0,1].forEach(i=>{if(!m.rdy[i]&&t-m.calledAt>=10)L.push({w:'미도착',c:'st-bad',x:`${tn(i?m.b:m.a)} 호출 뒤 ${Math.floor(t-m.calledAt)}분째 미도착 (${m.court}코트)`,b:`<button class="btn sm" data-action="ff" data-id="${m.id}" data-i="${i}">기권 처리</button>`})});
      if(!F.auto[m.court]&&m.rdy[0]&&m.rdy[1]&&!courtBusy(m.court))L.push({w:'시작 가능',c:'st-ok',x:`${m.court}코트 두 팀 도착 · ${pair(m)}`,b:`<button class="btn sm pri" data-action="start" data-id="${m.id}">경기 시작</button>`})}
    if(m.st==='sched'&&!F.auto[m.court]&&m.a&&m.b&&t>=m.sch+m.shift-10&&isNextOnCourt(m))L.push({w:'호출',c:'st-warn',x:`${m.court}코트 ${hm(m.sch+m.shift)} ${pair(m)} 호출 시간`,b:`<button class="btn sm pri" data-action="call" data-id="${m.id}">호출</button>`});
  });

const ST={sched:['예정','st-mut'],called:['호출됨','st-warn'],live:['진행 중','st-bad'],review:['확인 대기','st-info'],dispute:['이의 제기','st-bad'],done:['종료','st-ok']};

function koHTML(){

/* ---------- 대회 찾기 ---------- */
const countOf=t=>t===F?TEAMS.length:(t.count||0);
function status(t){
  if(t===F)return F.phase==='live'?[`진행 중 · ${stageText()}`,'st-bad',1]:F.phase==='done'?['대회 종료','st-mut']:['오늘 · 체크인 중','st-info'];
  if(t.ended)return ['대회 종료','st-mut'];
  if(countOf(t)>=t.cap)return ['정원 마감','st-warn'];
  const d=dday(t.deadline);if(d<0)return ['신청 마감','st-mut'];
  return d<=1?[`마감 임박 · D-${d}`,'st-bad']:[`접수 중 · D-${d}`,'st-ok'];
}
function vExplore(){
  const list=ORDER.map(id=>T[id]).filter(t=>S.filter==='all'||t.sport===S.filter);

  <div class="filters"><div class="seg" role="group" aria-label="종목">${[['all','전체'],...Object.entries(SPORT)].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div><span class="small muted">${list.length}개 대회</span></div>

/* ---------- 심판: 코트별 점수 입력 ---------- */
function vRef(){
  const c=S.rc;
  const head=`<div class="pagehead"><div><div class="kicker">Scorekeeper</div><h1>심판 · 점수 입력</h1></div><div class="acts"><div class="seg" role="group" aria-label="코트">${['A','B'].map(k=>`<button data-rc="${k}" aria-pressed="${c===k}">${k}코트 · ${esc(F.refs[k])}</button>`).join('')}</div></div></div>`;
  if(F.phase==='setup')return head+'<div class="ref"><div class="rcard"><p class="muted" style="margin:0">대진이 공개되면 이 코트 경기가 순서대로 나와요.</p></div></div>';
  const q=F.M.filter(m=>m.court===c&&m.st!=='done').sort(byTime);
  const live=q.find(m=>m.st==='live'),rev=q.find(m=>m.st==='review'||m.st==='dispute'),nx=q.find(m=>m.st==='sched'||m.st==='called'),lock=F.auto[c];
  const banner=lock?`<div class="banner"><span>${esc(F.refs[c])}이 이 코트를 입력하고 있어요.</span><button class="btn sm" data-action="takeCourt" data-c="${c}">이 코트 맡기</button></div>`:'';
  const main=live?refLive(live,lock):nx&&nx.a&&nx.b?refNext(nx,lock):`<div class="rcard"><p class="muted" style="margin:0">${q.length?'다음 경기 팀이 아직 정해지지 않았어요.':'이 코트 경기가 모두 끝났어요.'}</p></div>`;
  const revc=rev?`<div class="rcard"><div class="small muted">제출한 결과</div><div>${esc(tn(rev.a))} <b class="mono">${rev.sa}:${rev.sb}</b> ${esc(tn(rev.b))}${rev.pa!=null?` (승부차기 ${rev.pa}:${rev.pb})`:''} · ${rev.st==='dispute'?'<span class="st-bad state">이의 제기됨 · 운영본부 확인 중</span>':`양 팀 확인 ${rev.ok.filter(Boolean).length}/2`}</div></div>`:'';
  const after=live&&nx?`<div class="rcard"><div class="small muted">다음 경기</div><div><b class="mono">${hm(nx.sch+nx.shift)}</b> ${stageLabel(nx)} · ${nm(nx,0)} vs ${nm(nx,1)}${nx.st==='called'?' · <span class="st-warn">호출됨</span>':''}</div></div>`:'';
  return head+`<div class="ref">${banner}${main}${revc}${after}</div>`;
}
function refLive(m,lock){
  const h=m.el<CFG.dur*30?0:1,dis=lock?'disabled':'';
  const side=i=>{const f=m.fo[h][i];return `<div class="rt"><b>${esc(tn(i?m.b:m.a))}</b><span class="rsc">${i?m.sb:m.sa}</span><button class="rplus" data-action="goal" data-id="${m.id}" data-i="${i}" ${dis}>+1 득점</button>
    <div class="rmini"><button data-action="ungoal" data-id="${m.id}" data-i="${i}" ${dis}>득점 취소</button><button data-action="foul" data-id="${m.id}" data-i="${i}" ${dis}>파울 ${f}</button></div>${f>=5?'<div class="small st-warn">누적 파울 5개 · 다음 파울부터 제2 PK</div>':''}</div>`};
  return `<div class="rcard live"><div class="small muted" style="text-align:center">${stageLabel(m)} · ${hm(m.sch+m.shift)} 경기 · 파울은 ${h?'후반':'전반'} 누적</div>
    <div class="rtimer"><span class="tmr" data-timer="${m.id}">${clockText(m)}</span>${m.timeup?'<span class="st-warn state">경기 시간 종료</span>':`<button class="btn sm" data-action="pause" data-id="${m.id}" ${dis}>${m.run?'일시 정지':'다시 시작'}</button>`}</div>
    <div class="rteams">${side(0)}<span class="rvs">:</span>${side(1)}</div>
    <button class="btn pri big wide" data-action="end" data-id="${m.id}" ${dis}>경기 종료하고 결과 제출</button>
    ${m.ev.length?`<div class="evs">${m.ev.slice(0,8).map(e=>`<span><span class="mono muted">${e.t}</span> ${e.k==='goal'?'득점':'파울'} · ${esc(tn(e.s?m.b:m.a))}</span>`).join('')}</div>`:''}</div>`;
}
function refNext(m,lock){
  const dis=lock?'disabled':'';
  const rd=i=>`<div class="rrow"><b>${esc(tn(i?m.b:m.a))}</b>${m.rdy[i]?'<span class="st-ok state">도착</span>':`<button class="btn sm" data-action="arrive" data-id="${m.id}" data-i="${i}" ${dis}>도착 확인</button>`}</div>`;
  return `<div class="rcard"><div class="small muted">다음 경기 · ${stageLabel(m)}</div><div class="big2 mono">${hm(m.sch+m.shift)}</div><div>${esc(tn(m.a))} vs ${esc(tn(m.b))}</div>
    ${m.st==='sched'?`<button class="btn big wide" data-action="call" data-id="${m.id}" ${dis}>양 팀 호출</button><p class="note" style="margin:0">호출하면 두 팀 대표에게 코트로 오라는 알림이 갑니다.</p>`
    :`<div class="small">호출 ${hm(m.calledAt)}</div><div>${rd(0)}${rd(1)}</div><button class="btn pri big wide" data-action="start" data-id="${m.id}" ${m.rdy[0]&&m.rdy[1]&&!lock?'':'disabled'}>경기 시작</button>`}</div>`;
}

    case 'takeCourt':{const c=b.dataset.c;F.auto[c]=false;F.refs[c]='나';log(`${c}코트 심판 교대 · 나`,{c});break}
    case 'checkin':{const id=b.dataset.t;F.checkin[id]=hm(now());log(`${tn(id)} 체크인`);if(id===MY)notifyMe('체크인 완료');break}
    case 'redraw':F.seeded=!!document.getElementById('seedChk')?.checked;drawGroups(F.seeded);toast('조를 다시 추첨했어요');break;
    case 'swapAsk':return swapModal(b.dataset.t);
    case 'applyCfg':{const st=document.getElementById('stT').value,du=+document.getElementById('durI').value,ga=+document.getElementById('gapI').value;
      if(!st||du<10||du>40||ga<0||ga>15)return toast('경기 시간은 10~40분, 교체 시간은 0~15분으로 넣어 주세요');F.startT=st;CFG.dur=du;CFG.gap=ga;toast('일정 설정을 반영했어요');break}
    case 'publish':startLive(toM(F.startT));toast('대진과 일정을 공개했어요. 모든 팀에 알림을 보냈어요');break;
    case 'postNotice':{const h=document.getElementById('nh').value.trim(),bd=document.getElementById('nb').value.trim(),to=document.getElementById('nto').value;if(!h||!bd)return toast('제목과 내용을 적어 주세요');
      F.notices.unshift({t:hm(now()),to,h,b:bd});log(`공지 · ${h} (${to})`);const g=F.groups.A.includes(MY)?'A조':'B조';if(to==='전체'||to===g||(to==='본선 진출 팀'&&['sf1','sf2'].some(id=>involves(byId(id)||{},MY))))notifyMe(`공지 · ${h}`);toast(`${to}에게 공지를 보냈어요`);break}
    case 'apply':return applyModal(T[b.dataset.id]);
    case 'paid':{const en=S.entries[i];en.st='check';toast('입금 확인을 요청했어요');setTimeout(()=>{en.st='confirmed';S.dirty=true;toast(`${T[en.tid].host}에서 입금을 확인했어요. 참가가 확정됐어요`)},4000);break}
    case 'cancelEntry':{const en=S.entries[i],t=T[en.tid];return modal(`<h3>신청 취소</h3><p class="note" style="color:var(--fg)">${esc(t.name)} · ${esc(en.team)}</p><p class="note">${esc(t.refund||'')}</p>${foot('취소하기','danger')}`,md=>{md.querySelector('#ok').onclick=()=>{S.entries.splice(i,1);t.count=Math.max(0,(t.count||1)-1);if(t.sample)t.sample=t.sample.filter(x=>x!==en.team);closeModal();render();toast('신청을 취소했어요')}})}
    case 'copyShare':return copy(document.getElementById('shareLink'));
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{if(e.target.id==='teamSel'){S.schTeam=e.target.value;render()}});

/* ---------- 시작 ---------- */
setInterval(()=>{tick();paintClock();paintTimers();if(S.dirty&&canRender()){S.dirty=false;render()}},1000);
render();
</script>
</body>
</html>
