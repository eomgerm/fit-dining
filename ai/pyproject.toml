[project]
name = "fit-ai"
version = "0.1.0"
description = "핏다이닝 AI: 취향·가게 분석과 비교"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=6.2.0",
]

[project.optional-dependencies]
# GPU는 `uv sync --extra cu128`. PyPI 기본 빌드(CUDA 13)는 드라이버가 CUDA 12.8까지인 GPU 서버에서 돌지 않는다
cpu = ["torch"]
cu128 = ["torch"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/는 소스 구조를 따른다. 폴더가 달라도 같은 파일 이름을 쓸 수 있게 importlib로 불러온다
addopts = ["--import-mode=importlib"]
# server/는 설치되는 패키지가 아니라서 테스트가 ai/ 기준으로 import한다
pythonpath = ["."]

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "uvicorn>=0.54.0",
]
server = [
    "fastapi>=0.162.0",
]

[tool.uv]
# server 그룹은 Modal 이미지에도 들어간다(server/embed.py). 로컬 테스트도 쓰므로 기본으로 설치한다
default-groups = ["dev", "server"]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
