server:
  # BE는 호스트에 게시하지 않으며, Caddy·FE의 net-prod/net-dev Docker 사설 대역은 Tomcat 기본 신뢰 대역에 포함된다.
  forward-headers-strategy: native
  shutdown: graceful

spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/fit_dev}
    username: ${SPRING_DATASOURCE_USERNAME:fit_dev_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        # Constraint errors may otherwise include email/nickname values in driver exceptions.
        logServerErrorDetail: false
  flyway:
    # 웹 앱은 DML 전용 계정으로 접속하므로 마이그레이션을 실행하지 않는다.
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    # compose의 stop_grace_period(40s)보다 짧아야 처리 중인 요청을 마치고 내려간다(BE 계약 #4).
    timeout-per-shutdown-phase: 30s

management:
  server:
    # 관리 경로는 공개 포트(8080)가 아니라 8081에서만 열고 프록시하지 않는다. 배포 스크립트와 모니터링이 컨테이너 안쪽 주소로 부른다.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # 외부 서비스(Modal 등)를 보면 외부 장애가 readiness를 흔들어 재시작 폭풍이 난다. DB만 본다.
          include: readinessState,db

# 배포 이미지가 넣는 값(Dockerfile ENV). 로컬에서는 unknown이다.
app:
  version:
    sha: ${APP_SHA:unknown}
    built-at: ${APP_BUILT_AT:unknown}

place:
  mock:
    enabled: ${PLACE_MOCK_ENABLED:false}

review:
  photo:
    # BE가 부르는 Garage S3 API 주소(서버는 내부 주소)
    endpoint: ${S3_ENDPOINT:}
    # 브라우저가 올리는 주소의 출처. presigned URL 서명에 Host가 들어가 브라우저가 보내는 Host와 같아야 한다(D-45)
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:garage}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    # Caddy가 확정 사진만 공개로 여는 같은 출처 경로(인프라 5.2절). 로컬은 APP_ENV가 없어 dev 경로를 쓰고 next dev가 넘긴다
    read-prefix: /photos/${APP_ENV:dev}/confirmed/
    # PRD OQ-07 제안값. 앱이 품질과 크기를 낮춰 이 안으로 맞춰 올린다(D-45)
    max-bytes: 1048576
    thumb-max-bytes: 102400
    upload-ttl: PT10M

auth:
  terms-version: ${AUTH_TERMS_VERSION:2026-10-23}
  simple:
    enabled: ${AUTH_SIMPLE_ENABLED:false}
    dev-key: ${AUTH_DEV_KEY:}
  jwt-secret: ${JWT_SECRET:}
  frontend-origin: ${AUTH_FRONTEND_ORIGIN}
  cookie-secure: ${AUTH_COOKIE_SECURE}
  cleanup:
    interval: PT10M
    token-retention: P7D
    event-retention: P90D
    attempt-retention: PT15M
    batch-size: 1000

fitdining:
  onboarding:
    taste-analyzer: ${TASTE_ANALYZER:mock}
    timeout-ms: 3000
