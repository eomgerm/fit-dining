<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 3. DB 계정 구조</title>
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #0f172a; }
  #frame { width: 1280px; padding: 28px 24px 24px; box-sizing: border-box; background: #fff; }
  .head { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px 8px; }
  .head b { font-size: 26px; }
  .head span { font-size: 17px; color: #475569; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
  .t  { font-size: 16px; font-weight: 700; fill: #0f172a; }
  .m  { font-size: 16px; font-weight: 700; fill: #1d4ed8; font-family: Consolas, 'Courier New', monospace; }
  .s  { font-size: 13px; fill: #475569; }
  .h  { font-size: 14px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
  .lab { font-size: 13px; font-weight: 700; fill: #1e293b; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .box   { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; }
  .blue  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
  .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
  .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
  .redbx { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
  .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .arr   { fill: none; stroke: #475569; stroke-width: 1.8; }
  .arrw  { fill: none; stroke: #d97706; stroke-width: 2.2; }
  .arrr  { fill: none; stroke: #dc2626; stroke-width: 2.2; }
  .note  { font-size: 14px; fill: #334155; }
</style>
</head>
<body>
<div id="frame">
  <div class="head"><b>DB 계정 구조</b><span>스키마를 바꾸는 계정은 마이그레이션 하나뿐이고, 앱은 데이터만 만지며, AI는 읽기만 한다</span></div>
  <svg viewBox="0 0 1232 640" role="img" aria-label="BE는 환경별 앱 계정으로 자기 환경의 DB에 읽고 쓴다. AI는 읽기 전용 계정으로 자기 환경의 DB를 읽는다. 마이그레이션 컨테이너만 DDL 계정으로 두 DB의 스키마를 바꾼다. 관측은 통계만 읽고 관리자는 슈퍼유저로 접속한다.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
      <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
      <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    </defs>

    <text class="h" x="14" y="24">누가</text>
    <text class="h" x="396" y="24">어떤 계정으로</text>
    <text class="h" x="880" y="24">어느 DB에 (Postgres 컨테이너 1개)</text>

    <!-- DB 패널 -->
    <rect class="panel" x="862" y="34" width="356" height="548" rx="14"/>
    <rect class="green" x="880" y="50" width="320" height="140" rx="10"/>
    <text class="t" x="1040" y="112" text-anchor="middle">fit_prod</text>
    <text class="s" x="1040" y="134" text-anchor="middle">prod 데이터</text>
    <rect class="blue" x="880" y="278" width="320" height="140" rx="10"/>
    <text class="t" x="1040" y="340" text-anchor="middle">fit_dev</text>
    <text class="s" x="1040" y="362" text-anchor="middle">dev 데이터</text>
    <rect class="box" x="880" y="430" width="320" height="140" rx="10"/>
    <text class="t" x="1040" y="492" text-anchor="middle">postgres</text>
    <text class="s" x="1040" y="514" text-anchor="middle">관리용 기본 DB</text>

    <!-- 1 BE prod -->
    <rect class="box" x="14" y="44" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="72">BE (prod)</text><text class="s" x="30" y="93">be-prod-blue / green</text>
    <rect class="box" x="396" y="44" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="72">fit_prod_app</text><text class="s" x="412" y="93">조회 · 추가 · 수정 · 삭제만</text>
    <path class="arr" d="M264,76 H394" marker-end="url(#a)"/>
    <path class="arr" d="M736,76 H878" marker-end="url(#a)"/>
    <text class="lab" x="807" y="68" text-anchor="middle">읽기·쓰기</text>

    <!-- 2 AI prod -->
    <rect class="box" x="14" y="120" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="148">AI API (prod)</text><text class="s" x="30" y="169">ai-prod</text>
    <rect class="box" x="396" y="120" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="148">fit_prod_ai</text><text class="s" x="412" y="169">읽기 전용 · 뷰 1개 + 테이블 1개 · 연결 6개</text>
    <path class="arr" d="M264,152 H394" marker-end="url(#a)"/>
    <path class="arr" d="M736,152 H878" marker-end="url(#a)"/>
    <text class="lab" x="807" y="144" text-anchor="middle">읽기만</text>

    <!-- 3 마이그레이션 -->
    <rect class="amber" x="14" y="196" width="250" height="64" rx="10" style="fill:#fffbeb"/>
    <text class="t" x="30" y="224">마이그레이션</text><text class="s" x="30" y="245">배포 때 뜨는 일회성 컨테이너</text>
    <rect class="amber" x="396" y="196" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="224" style="fill:#b45309">fit_migrator</text><text class="s" x="412" y="245">스키마 변경(DDL) · 두 DB의 소유자</text>
    <path class="arr" d="M264,228 H394" marker-end="url(#a)"/>
    <path class="arrw" d="M736,228 H940 V192" marker-end="url(#w)"/>
    <path class="arrw" d="M940,228 V276" marker-end="url(#w)"/>
    <text class="lab" x="846" y="219" text-anchor="middle" style="fill:#b45309">스키마 변경</text>

    <!-- 4 BE dev -->
    <rect class="box" x="14" y="272" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="300">BE (dev)</text><text class="s" x="30" y="321">be-dev</text>
    <rect class="box" x="396" y="272" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="300">fit_dev_app</text><text class="s" x="412" y="321">조회 · 추가 · 수정 · 삭제만 · 쿼리 30초 제한</text>
    <path class="arr" d="M264,304 H394" marker-end="url(#a)"/>
    <path class="arr" d="M736,304 H878" marker-end="url(#a)"/>
    <text class="lab" x="807" y="296" text-anchor="middle">읽기·쓰기</text>

    <!-- 5 AI dev -->
    <rect class="box" x="14" y="348" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="376">AI API (dev)</text><text class="s" x="30" y="397">ai-dev</text>
    <rect class="box" x="396" y="348" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="376">fit_dev_ai</text><text class="s" x="412" y="397">읽기 전용 · 뷰 1개 + 테이블 1개 · 연결 6개</text>
    <path class="arr" d="M264,380 H394" marker-end="url(#a)"/>
    <path class="arr" d="M736,380 H878" marker-end="url(#a)"/>
    <text class="lab" x="807" y="372" text-anchor="middle">읽기만</text>

    <!-- 6 관측 -->
    <rect class="box" x="14" y="440" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="468">관측</text><text class="s" x="30" y="489">postgres-exporter</text>
    <rect class="box" x="396" y="440" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="468">fit_monitor</text><text class="s" x="412" y="489">통계만 읽기 · 앱 DB에는 접속 못 한다</text>
    <path class="arr" d="M264,472 H394" marker-end="url(#a)"/>
    <path class="arr" d="M736,472 H878" marker-end="url(#a)"/>
    <text class="lab" x="807" y="464" text-anchor="middle">통계</text>

    <!-- 7 관리자 -->
    <rect class="redbx" x="14" y="516" width="250" height="64" rx="10"/>
    <text class="t" x="30" y="544">관리자</text><text class="s" x="30" y="565">SSH 터널 → 127.0.0.1:5432</text>
    <rect class="redbx" x="396" y="516" width="340" height="64" rx="10"/>
    <text class="m" x="412" y="544" style="fill:#b91c1c">postgres</text><text class="s" x="412" y="565">슈퍼유저 · 모든 DB</text>
    <path class="arr" d="M264,548 H394" marker-end="url(#a)"/>
    <path class="arrr" d="M736,548 H878" marker-end="url(#r)"/>
    <text class="lab" x="807" y="540" text-anchor="middle" style="fill:#b91c1c">전부</text>

    <text class="note" x="14" y="614">Postgres 포트는 서버의 127.0.0.1:5432에만 열려 있다. 밖에서는 SSH 터널 없이 접속할 수 없다.</text>
  </svg>
</div>
</body>
</html>
