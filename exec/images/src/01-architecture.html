<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 1. 서비스 구성</title>
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #0f172a; }
  #frame { width: 1280px; padding: 28px 24px 24px; box-sizing: border-box; background: #fff; }
  .head { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px 8px; }
  .head b { font-size: 26px; }
  .head span { font-size: 17px; color: #475569; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
  .t  { font-size: 16px; font-weight: 700; fill: #0f172a; }
  .s  { font-size: 13px; fill: #475569; }
  .row { font-size: 13px; fill: #94a3b8; letter-spacing: 1px; }
  .lab { font-size: 13px; fill: #1e293b; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .labr { font-size: 14px; font-weight: 700; fill: #b91c1c; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .blue  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
  .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
  .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
  .slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; }
  .ghost { fill: #fff; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 7 5; }
  .user  { fill: #fff; stroke: #0f172a; stroke-width: 1.6; }
  .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .arr   { fill: none; stroke: #475569; stroke-width: 1.8; }
  .pub   { fill: none; stroke: #dc2626; stroke-width: 3; }
</style>
</head>
<body>
<div id="frame">
  <div class="head"><b>서비스 구성</b><span>공개 포트는 Caddy(80 · 443) 하나이고, 나머지는 서버 안 망으로만 닿는다</span></div>
  <svg viewBox="0 0 1232 770" role="img" aria-label="브라우저는 서버 A의 Caddy(80과 443 포트)로만 들어오고, Caddy가 FE와 BE와 사진 저장소로 나눠 보낸다. BE는 DB와 Redis와 사진 저장소를 부르고 AI는 DB를 읽기 전용으로 읽는다. OpenSearch는 구축만 되어 있고 앱은 쓰지 않는다. 서버 A에는 배포 러너와 FE 검사 러너가 있고, 서버 B는 빌드와 시험, 감시, 백업을 맡는다.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
      <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    </defs>

    <!-- 사용자 -->
    <rect class="user" x="14" y="78" width="132" height="74" rx="10"/>
    <text class="t" x="80" y="108" text-anchor="middle">브라우저</text>
    <text class="s" x="80" y="130" text-anchor="middle">PWA · 사용자</text>

    <!-- 서버 A -->
    <rect class="panel" x="170" y="30" width="860" height="545" rx="14"/>
    <text class="t" x="188" y="58">서버 A</text>
    <text class="s" x="246" y="58">EC2 t3.xlarge · x86 · 4 vCPU · 16GB</text>

    <text class="row" x="202" y="96">엣지</text>
    <text class="row" x="202" y="234">앱</text>
    <text class="row" x="202" y="358">데이터</text>
    <text class="row" x="202" y="478">운영</text>

    <!-- 엣지 -->
    <rect class="blue" x="470" y="80" width="260" height="70" rx="10"/>
    <text class="t" x="600" y="108" text-anchor="middle">Caddy 2.11</text>
    <text class="s" x="600" y="130" text-anchor="middle">HTTPS · 라우팅 · 80/443</text>

    <path class="pub" d="M146,115 H468" marker-end="url(#r)"/>
    <text class="labr" x="318" y="103" text-anchor="middle">HTTPS :443</text>

    <!-- 앱 -->
    <rect class="blue" x="240" y="210" width="180" height="90" rx="10"/>
    <text class="t" x="330" y="240" text-anchor="middle">FE · Next.js</text>
    <text class="s" x="330" y="263" text-anchor="middle">Node 22 · :3000</text>
    <text class="s" x="330" y="283" text-anchor="middle">화면(SSR)</text>

    <rect class="blue" x="500" y="210" width="200" height="90" rx="10"/>
    <text class="t" x="600" y="240" text-anchor="middle">BE · Spring Boot</text>
    <text class="s" x="600" y="263" text-anchor="middle">Java 21 · :8080</text>
    <text class="s" x="600" y="283" text-anchor="middle">API · 인증 · 배치</text>

    <rect class="blue" x="780" y="210" width="180" height="90" rx="10"/>
    <text class="t" x="870" y="240" text-anchor="middle">AI · FastAPI</text>
    <text class="s" x="870" y="263" text-anchor="middle">Python 3.12 · :8000</text>
    <text class="s" x="870" y="283" text-anchor="middle">검색 해석 · 추천</text>
    <text class="s" x="240" y="322">prod는 blue/green 두 벌, dev는 한 벌</text>

    <!-- 엣지 → 앱 -->
    <path class="arr" d="M520,150 V180 H330 V208" marker-end="url(#a)"/>
    <text class="lab" x="425" y="173" text-anchor="middle">화면 /</text>
    <path class="arr" d="M600,150 V208" marker-end="url(#a)"/>
    <text class="lab" x="610" y="186">/api/*</text>
    <path class="arr" d="M470,140 H190 V410 H208" marker-end="url(#a)"/>
    <text class="lab" x="300" y="162" text-anchor="middle">사진 /photos</text>

    <!-- 앱 ↔ 앱 -->
    <path class="arr" d="M420,255 H498" marker-end="url(#a)"/>
    <text class="lab" x="459" y="246" text-anchor="middle">내부 :8081</text>
    <path class="arr" d="M700,255 H778" marker-end="url(#a)"/>
    <text class="lab" x="739" y="246" text-anchor="middle">HTTP</text>

    <!-- 데이터 -->
    <rect class="green" x="210" y="370" width="140" height="80" rx="10"/>
    <text class="t" x="280" y="402" text-anchor="middle">Garage</text>
    <text class="s" x="280" y="424" text-anchor="middle">사진 저장소(S3)</text>

    <rect class="green" x="420" y="370" width="140" height="80" rx="10"/>
    <text class="t" x="490" y="402" text-anchor="middle">Redis ×2</text>
    <text class="s" x="490" y="424" text-anchor="middle">세션 · prod/dev</text>

    <rect class="green" x="640" y="370" width="190" height="80" rx="10"/>
    <text class="t" x="735" y="402" text-anchor="middle">PostgreSQL 16</text>
    <text class="s" x="735" y="424" text-anchor="middle">fit_prod · fit_dev</text>

    <rect class="ghost" x="850" y="370" width="150" height="80" rx="10"/>
    <text class="t" x="925" y="402" text-anchor="middle" style="fill:#64748b">OpenSearch</text>
    <text class="s" x="925" y="424" text-anchor="middle">구축만 · 앱 미사용</text>

    <!-- BE → 데이터 -->
    <path class="arr" d="M600,300 V335"/>
    <path class="arr" d="M280,335 H700"/>
    <path class="arr" d="M280,335 V368" marker-end="url(#a)"/>
    <path class="arr" d="M490,335 V368" marker-end="url(#a)"/>
    <path class="arr" d="M700,335 V368" marker-end="url(#a)"/>
    <text class="lab" x="288" y="360">S3 API</text>
    <text class="lab" x="498" y="360">세션</text>
    <text class="lab" x="708" y="360">JDBC</text>

    <!-- AI → DB -->
    <path class="arr" d="M810,300 V368" marker-end="url(#a)"/>
    <text class="lab" x="820" y="352">읽기 전용</text>

    <!-- 운영 -->
    <rect class="slate" x="210" y="485" width="250" height="60" rx="10"/>
    <text class="t" x="335" y="511" text-anchor="middle">관측</text>
    <text class="s" x="335" y="531" text-anchor="middle">Prometheus · Grafana · Dozzle</text>
    <rect class="slate" x="480" y="485" width="250" height="60" rx="10"/>
    <text class="t" x="605" y="511" text-anchor="middle">GitLab Runner(deploy)</text>
    <text class="s" x="605" y="531" text-anchor="middle">이미지 조립 · 배포</text>
    <rect class="slate" x="750" y="485" width="250" height="60" rx="10"/>
    <text class="t" x="875" y="511" text-anchor="middle">GitLab Runner(verify-fe)</text>
    <text class="s" x="875" y="531" text-anchor="middle">FE 검사(MR 코드, 격리)</text>

    <!-- 외부 서비스 -->
    <text class="s" x="1062" y="196">외부 서비스</text>
    <rect class="amber" x="1062" y="212" width="160" height="62" rx="10"/>
    <text class="t" x="1142" y="239" text-anchor="middle">Modal</text>
    <text class="s" x="1142" y="259" text-anchor="middle">임베딩 GPU</text>
    <rect class="amber" x="1062" y="298" width="160" height="62" rx="10"/>
    <text class="t" x="1142" y="325" text-anchor="middle">GMS</text>
    <text class="s" x="1142" y="345" text-anchor="middle">SSAFY LLM API</text>
    <path class="arr" d="M960,243 H1060" marker-end="url(#a)"/>
    <text class="lab" x="1010" y="234" text-anchor="middle">임베딩</text>
    <path class="arr" d="M960,272 H1010 V329 H1060" marker-end="url(#a)"/>
    <text class="lab" x="1035" y="318" text-anchor="middle">LLM</text>

    <!-- 서버 B -->
    <rect class="panel" x="170" y="625" width="860" height="125" rx="14"/>
    <text class="t" x="188" y="653">서버 B</text>
    <text class="s" x="246" y="653">EC2 c6g.large · Arm · 2 vCPU · 4GB</text>
    <rect class="slate" x="190" y="672" width="240" height="62" rx="10"/>
    <text class="t" x="310" y="699" text-anchor="middle">GitLab Runner(verify)</text>
    <text class="s" x="310" y="719" text-anchor="middle">lint · BE 시험 · 빌드</text>
    <rect class="slate" x="450" y="672" width="280" height="62" rx="10"/>
    <text class="t" x="590" y="699" text-anchor="middle">외부 감시</text>
    <text class="s" x="590" y="719" text-anchor="middle">Prometheus · Alertmanager</text>
    <rect class="slate" x="750" y="672" width="260" height="62" rx="10"/>
    <text class="t" x="880" y="699" text-anchor="middle">백업 금고</text>
    <text class="s" x="880" y="719" text-anchor="middle">암호화한 덤프만 보관</text>

    <path class="arr" d="M880,575 V670" marker-end="url(#a)"/>
    <text class="lab" x="890" y="607">덤프 전송(SSH)</text>
    <path class="arr" d="M590,670 V577" marker-end="url(#a)"/>
    <text class="lab" x="600" y="607">HTTPS 프로브</text>
  </svg>
</div>
</body>
</html>
