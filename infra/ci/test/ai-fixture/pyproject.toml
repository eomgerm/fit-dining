[project]
name = "fit-ai"
version = "0.1.0"
description = "Dockerfile.ai 시험용 가짜 ai/ 프로젝트(infra/ci/test/images-in-container.sh). 실제 ai/pyproject.toml의 의존성 구조(필수 의존성과 server 그룹)만 따른다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
server = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
