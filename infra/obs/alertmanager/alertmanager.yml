# 서버 A의 Alertmanager 설정(설계 9.4절). Mattermost 수신 웹훅은 Slack 호환이라 slack_configs로 보낸다. 웹훅 주소는 파일에서 읽는다(obs-init이 만든다).
# 메시지를 줄이려고 알림을 알림 이름이 아니라 환경(site/env)별로 묶는다. 같은 환경의 알림은 한 메시지에 모인다.
#   main        prod와 A 전체의 critical. 바로 보내고(30초 모음) 1시간마다 다시 알린다. 해소도 알린다
#   main-quiet  prod와 A 전체의 warning, info. 5분 모아서 보내고 새 알림은 1시간 단위로 보태며 24시간마다 다시 알린다. 해소는 알리지 않는다
#   dev         env=dev인 알림 전부. main-quiet과 같은 간격이고 해소는 알리지 않는다
# 전체 상태는 일일 점검 요약(infra/obs/daily-digest.py)이 하루 두 번 한 메시지로 보여 준다.
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: main
  group_by: [site, env]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [env="dev"]
      receiver: dev
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h
    - matchers: [severity="critical"]
      receiver: main
      repeat_interval: 1h
    - matchers: [severity=~"warning|info"]
      receiver: main-quiet
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h

# 같은 알림의 critical이 떠 있으면 warning은 보내지 않는다
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, site, env]

# 제목 링크의 기본값은 Alertmanager의 내부 주소라 Mattermost에서 눌러도 열리지 않는다. 비운다
receivers:
  - name: main
    slack_configs:
      - api_url_file: /generated/secrets/mattermost_url
        send_resolved: true
        title: '{{ template "fit.title" . }}'
        title_link: ''
        fallback: '{{ template "fit.fallback" . }}'
        text: '{{ template "fit.text" . }}'
        color: '{{ template "fit.color" . }}'
  - name: main-quiet
    slack_configs:
      - api_url_file: /generated/secrets/mattermost_url
        send_resolved: false
        title: '{{ template "fit.title" . }}'
        title_link: ''
        fallback: '{{ template "fit.fallback" . }}'
        text: '{{ template "fit.text" . }}'
        color: '{{ template "fit.color" . }}'
  - name: dev
    slack_configs:
      - api_url_file: /generated/secrets/mattermost_url_dev
        send_resolved: false
        title: '{{ template "fit.title" . }}'
        title_link: ''
        fallback: '{{ template "fit.fallback" . }}'
        text: '{{ template "fit.text" . }}'
        color: '{{ template "fit.color" . }}'
