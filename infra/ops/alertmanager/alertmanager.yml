# 서버 B의 Alertmanager 설정(설계 9.4절). B의 알림은 모두 prod에 관한 것이라 수신 채널은 하나다.
# 웹훅 주소는 파일에서 읽는다(ops-init이 만든다). 메시지 형식과 묶는 방식은 A의 것과 같다(infra/obs/alertmanager).
#   main        critical. 바로 보내고(30초 모음) 1시간마다 다시 알린다. 해소도 알린다
#   main-quiet  warning, info. 5분 모아서 보내고 새 알림은 1시간 단위로 보태며 24시간마다 다시 알린다. 해소는 알리지 않는다
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: main
  group_by: [site, env]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: main
      repeat_interval: 1h
    - matchers: [severity=~"warning|info"]
      receiver: main-quiet
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, site, env]

# 제목 링크의 기본값은 Alertmanager의 내부 주소라 Mattermost에서 눌러도 열리지 않는다. 비운다
receivers:
  - name: main
    slack_configs:
      - api_url_file: /generated/secrets/mattermost_url
        send_resolved: true
        title: '{{ template "fit.title" . }}'
        title_link: ''
        fallback: '{{ template "fit.fallback" . }}'
        text: '{{ template "fit.text" . }}'
        color: '{{ template "fit.color" . }}'
  - name: main-quiet
    slack_configs:
      - api_url_file: /generated/secrets/mattermost_url
        send_resolved: false
        title: '{{ template "fit.title" . }}'
        title_link: ''
        fallback: '{{ template "fit.fallback" . }}'
        text: '{{ template "fit.text" . }}'
        color: '{{ template "fit.color" . }}'
